<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Preguntas Expansivas — La Casa del Profit</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#C9A84C">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0"></script>
<style>
:root{
  --bg:#06060A;--card:rgba(18,14,30,0.58);--border:rgba(201,168,76,0.20);
  --gold:#C9A84C;--gl:#E8C96A;--gd:#8B6914;--gold-pale:#F5E4A8;
  --text:#EDE5C8;--muted:#7A7260;--purple:#9B82D4;
  --blur:blur(20px);
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;}
#spiralCanvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none;}
#globalOverlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(4,5,2,0.28);z-index:1;pointer-events:none;}
#page{position:relative;z-index:2;width:100%;max-width:620px;padding:28px 16px 80px;display:flex;flex-direction:column;align-items:center;}

.back-btn{display:inline-flex;align-items:center;gap:6px;background:var(--card);backdrop-filter:var(--blur);
  border:1px solid var(--border);border-radius:10px;color:var(--muted);padding:8px 14px;
  font-size:13px;cursor:pointer;text-decoration:none;margin-bottom:28px;transition:border-color .2s,color .2s;align-self:flex-start;}
.back-btn:hover{border-color:var(--gold);color:var(--gl);}

.page-icon{font-size:44px;margin-bottom:12px;display:block;text-align:center;}
.page-title{font-size:22px;font-weight:800;color:var(--gl);letter-spacing:1px;margin-bottom:6px;text-align:center;}
.page-sub{font-size:13px;color:var(--muted);text-align:center;line-height:1.7;margin-bottom:28px;}

/* Categorías */
.cat-row{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin-bottom:28px;width:100%;}
.cat-btn{padding:7px 15px;border-radius:20px;border:1px solid rgba(155,130,212,.25);
  background:transparent;color:var(--muted);font-size:12px;font-weight:600;cursor:pointer;
  transition:all .2s;display:flex;align-items:center;gap:5px;}
.cat-btn:hover{border-color:rgba(155,130,212,.5);color:#C4AEFF;background:rgba(155,130,212,.08);}
.cat-btn.active{border-color:rgba(155,130,212,.6);background:rgba(155,130,212,.18);color:#C4AEFF;}
.cat-count{font-size:10px;padding:1px 5px;border-radius:10px;background:rgba(155,130,212,.2);}

/* Card pregunta */
.card-pregunta{
  background:var(--card);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  border:1px solid rgba(155,130,212,.35);border-radius:24px;padding:32px 28px;
  width:100%;position:relative;overflow:hidden;
  box-shadow:0 0 60px rgba(155,130,212,.08),0 8px 32px rgba(0,0,0,.5);
  margin-bottom:16px;min-height:140px;display:flex;align-items:center;justify-content:center;
  transition:opacity .25s;
}
.card-pregunta::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,#9B82D4,#C4AEFF,#9B82D4,transparent);}
.card-pregunta::after{content:'"';position:absolute;top:14px;left:18px;font-size:72px;
  color:rgba(155,130,212,.10);line-height:1;font-family:Georgia,serif;}

#preguntaTexto{font-size:17px;line-height:1.8;color:var(--text);text-align:center;
  position:relative;z-index:1;font-style:italic;}
#preguntaTexto.loading{color:var(--muted);}
#matizBadge{font-size:11px;color:#C4AEFF;opacity:.7;text-align:center;margin-bottom:12px;letter-spacing:.5px;}

.btn-row{display:flex;gap:10px;justify-content:center;margin-bottom:24px;flex-wrap:wrap;}
.btn-nueva{
  padding:13px 28px;background:linear-gradient(135deg,#9B82D4,#6B52A4);
  border:none;border-radius:14px;color:#fff;font-size:15px;font-weight:800;cursor:pointer;
  display:flex;align-items:center;gap:8px;
  transition:opacity .2s,transform .15s;box-shadow:0 4px 24px rgba(155,130,212,.3);
}
.btn-nueva:hover{opacity:.9;transform:translateY(-1px);}
.btn-nueva.spinning svg{animation:spin .6s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

.btn-guardar{
  padding:13px 22px;background:rgba(201,168,76,.12);border:1px solid rgba(201,168,76,.3);
  border-radius:14px;color:var(--gl);font-size:14px;font-weight:700;cursor:pointer;
  transition:all .2s;
}
.btn-guardar:hover{background:rgba(201,168,76,.2);}

.contador{font-size:11px;color:var(--muted);text-align:center;margin-bottom:20px;}

/* Área de trabajo */
.trabajo-card{
  background:var(--card);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  border:1px solid var(--border);border-radius:20px;padding:24px;width:100%;
}
.trabajo-title{font-size:13px;font-weight:700;color:var(--gl);margin-bottom:14px;letter-spacing:.5px;}
.trabajo-textarea{
  width:100%;min-height:120px;background:rgba(255,255,255,.04);border:1px solid rgba(201,168,76,.2);
  border-radius:12px;padding:14px;color:var(--text);font-size:14px;line-height:1.7;
  font-family:inherit;resize:vertical;outline:none;transition:border-color .2s;
}
.trabajo-textarea:focus{border-color:rgba(201,168,76,.5);}
.trabajo-footer{display:flex;align-items:center;justify-content:space-between;margin-top:10px;flex-wrap:wrap;gap:8px;}
.trabajo-hint{font-size:11px;color:var(--muted);}
.btn-save-ref{padding:8px 18px;background:linear-gradient(135deg,var(--gold),var(--gd));
  border:none;border-radius:10px;color:#050401;font-size:13px;font-weight:700;cursor:pointer;}
.btn-save-ref:hover{opacity:.9;}
.saved-tag{font-size:11px;color:#5DD89A;display:none;}

/* Reflexiones guardadas */
.refs-list{margin-top:20px;}
.ref-item{background:rgba(255,255,255,.03);border:1px solid rgba(201,168,76,.12);border-radius:12px;
  padding:14px;margin-bottom:8px;position:relative;}
.ref-q{font-size:11px;color:var(--muted);margin-bottom:6px;font-style:italic;}
.ref-txt{font-size:13px;color:var(--text);line-height:1.6;}
.ref-fecha{font-size:10px;color:var(--muted);margin-top:6px;}
.ref-del{position:absolute;top:10px;right:10px;background:none;border:none;color:var(--muted);
  cursor:pointer;font-size:14px;opacity:.5;}
.ref-del:hover{opacity:1;color:#F08080;}
</style>
</head>
<body>

<canvas id="spiralCanvas"></canvas>
<div id="globalOverlay"></div>

<div id="page">
  <a class="back-btn" href="/portal_ser.html">← Volver al portal</a>

  <span class="page-icon">💬</span>
  <div class="page-title">Preguntas Expansivas</div>
  <div class="page-sub">Permitite ser cuestionado/a.<br>Cada pregunta es una puerta hacia una versión más expandida de vos.</div>

  <!-- Categorías -->
  <div class="cat-row" id="catRow">
    <button class="cat-btn active" data-matiz="todos" onclick="setCat('todos')">Todas <span class="cat-count" id="cnt-todos">0</span></button>
    <button class="cat-btn" data-matiz="Identidad"   onclick="setCat('Identidad')">🪞 Identidad <span class="cat-count" id="cnt-Identidad">0</span></button>
    <button class="cat-btn" data-matiz="Dinero"      onclick="setCat('Dinero')">💰 Dinero <span class="cat-count" id="cnt-Dinero">0</span></button>
    <button class="cat-btn" data-matiz="Cuerpo"      onclick="setCat('Cuerpo')">🌿 Cuerpo <span class="cat-count" id="cnt-Cuerpo">0</span></button>
    <button class="cat-btn" data-matiz="Relaciones"  onclick="setCat('Relaciones')">🤝 Relaciones <span class="cat-count" id="cnt-Relaciones">0</span></button>
    <button class="cat-btn" data-matiz="Propósito"   onclick="setCat('Propósito')">🌟 Propósito <span class="cat-count" id="cnt-Propósito">0</span></button>
    <button class="cat-btn" data-matiz="Consciencia" onclick="setCat('Consciencia')">✨ Consciencia <span class="cat-count" id="cnt-Consciencia">0</span></button>
  </div>

  <div id="matizBadge"></div>

  <div class="card-pregunta">
    <p id="preguntaTexto" class="loading">Cargando...</p>
  </div>

  <div class="btn-row">
    <button class="btn-nueva" id="btnNueva" onclick="nuevaPregunta()">
      <svg id="iconSpinner" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <path d="M23 4v6h-6"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
      </svg>
      Nueva pregunta
    </button>
    <button class="btn-guardar" onclick="guardarReflexion()">✍️ Guardar mi reflexión</button>
  </div>

  <div class="contador" id="contador"></div>

  <!-- Área de trabajo -->
  <div class="trabajo-card">
    <div class="trabajo-title">✍️ Tu espacio para trabajar esta pregunta</div>
    <textarea class="trabajo-textarea" id="refTexto" placeholder="Escribí tu respuesta, lo que surge, lo que sentís... No busques hacerlo perfecto, buscá hacerlo honesto."></textarea>
    <div class="trabajo-footer">
      <span class="trabajo-hint">Tu reflexión se guarda localmente en este dispositivo.</span>
      <div style="display:flex;align-items:center;gap:10px">
        <span class="saved-tag" id="savedTag">✅ Guardada</span>
        <button class="btn-save-ref" onclick="guardarReflexion()">Guardar</button>
      </div>
    </div>
  </div>

  <!-- Reflexiones previas -->
  <div class="refs-list" id="refsList" style="width:100%"></div>

</div>

<script>
(function(){
  const canvas=document.getElementById('spiralCanvas');
  const ctx=canvas.getContext('2d');
  const TWO_PI=Math.PI*2;
  let W,H,cx,cy,t=0;
  function resize(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight;cx=W/2;cy=H/2;}
  function lerp(a,b,v){return a+(b-a)*v;}
  function pulse(speed,phase){return(Math.sin(t*speed+phase)+1)*0.5;}
  function drawBackground(){
    const grd=ctx.createRadialGradient(cx,cy*0.85,0,cx,cy,Math.max(W,H)*0.75);
    const p=pulse(0.4,0)*0.08;
    grd.addColorStop(0,`rgba(${Math.round(48+p*20)},${Math.round(34+p*10)},4,1)`);
    grd.addColorStop(0.25,'rgba(22,18,3,1)');grd.addColorStop(0.55,'rgba(10,13,5,1)');grd.addColorStop(1,'rgba(5,6,2,1)');
    ctx.fillStyle=grd;ctx.fillRect(0,0,W,H);
  }
  function drawRays(){
    const numRays=24,rayLength=Math.max(W,H)*0.85,rot=t*0.008,baseAlpha=0.030+pulse(0.5,1)*0.02;
    for(let i=0;i<numRays;i++){
      const a=(i/numRays)*TWO_PI+rot,x2=cx+rayLength*Math.cos(a),y2=cy+rayLength*Math.sin(a);
      const grd=ctx.createLinearGradient(cx,cy,x2,y2);
      grd.addColorStop(0,`rgba(232,201,106,${(baseAlpha*2).toFixed(3)})`);
      grd.addColorStop(0.15,`rgba(232,201,106,${baseAlpha.toFixed(3)})`);
      grd.addColorStop(1,'rgba(232,201,106,0)');
      ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(x2,y2);ctx.strokeStyle=grd;ctx.lineWidth=1;ctx.stroke();
    }
  }
  function drawFlowerOfLife(fR){
    const alpha=0.50+pulse(0.6,0.5)*0.18;
    ctx.strokeStyle=`rgba(232,201,106,${alpha.toFixed(3)})`;ctx.lineWidth=0.9;ctx.globalAlpha=1;
    function circ(x,y){ctx.beginPath();ctx.arc(x,y,fR,0,TWO_PI);ctx.stroke();}
    circ(cx,cy);
    for(let i=0;i<6;i++){const a=(i/6)*TWO_PI;circ(cx+fR*Math.cos(a),cy+fR*Math.sin(a));}
    for(let i=0;i<6;i++){const a=(i/6)*TWO_PI+Math.PI/6,d=Math.sqrt(3)*fR;circ(cx+d*Math.cos(a),cy+d*Math.sin(a));}
    for(let i=0;i<6;i++){const a=(i/6)*TWO_PI;circ(cx+2*fR*Math.cos(a),cy+2*fR*Math.sin(a));}
    const encR=2*fR;
    ctx.globalAlpha=alpha*1.2;ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(cx,cy,encR,0,TWO_PI);ctx.stroke();
    ctx.lineWidth=0.7;ctx.globalAlpha=alpha*0.8;
    ctx.beginPath();ctx.arc(cx,cy,encR+fR*0.12,0,TWO_PI);ctx.stroke();
    ctx.beginPath();ctx.arc(cx,cy,encR+fR*0.28,0,TWO_PI);ctx.stroke();
    ctx.globalAlpha=1;
  }
  function drawCentralGlow(fR){
    const p=pulse(0.6,1.2);
    const grd1=ctx.createRadialGradient(cx,cy,0,cx,cy,fR*1.6);
    grd1.addColorStop(0,`rgba(155,130,212,${(0.15+p*0.10).toFixed(3)})`);
    grd1.addColorStop(0.5,`rgba(155,130,212,${(0.04+p*0.03).toFixed(3)})`);
    grd1.addColorStop(1,'rgba(155,130,212,0)');
    ctx.fillStyle=grd1;ctx.fillRect(0,0,W,H);
    const vig=ctx.createRadialGradient(cx,cy,Math.min(W,H)*0.4,cx,cy,Math.max(W,H)*0.8);
    vig.addColorStop(0,'rgba(5,6,2,0)');vig.addColorStop(1,'rgba(4,5,1,0.80)');
    ctx.fillStyle=vig;ctx.fillRect(0,0,W,H);
  }
  function drawFrame(){
    const fR=Math.min(W,H)*0.082;
    drawBackground();drawRays();drawFlowerOfLife(fR);drawCentralGlow(fR);
    t+=0.016;requestAnimationFrame(drawFrame);
  }
  resize();window.addEventListener('resize',resize);drawFrame();
})();
</script>

<script>
const SUPA_URL='https://vffmnyjjawvvctcqzkvj.supabase.co';
const SUPA_KEY='sb_publishable_A1rJIiXHSg6TQYT2gKQHUw_UTwmS76t';
const _sb=supabase.createClient(SUPA_URL,SUPA_KEY);

const MATIZ_LABEL={Identidad:'🪞 Identidad',Dinero:'💰 Dinero',Cuerpo:'🌿 Cuerpo',Relaciones:'🤝 Relaciones','Propósito':'🌟 Propósito',Consciencia:'✨ Consciencia'};

let _todas=[], _pool=[], _usadas=new Set(), _actual=null, _catActual='todos';

async function init(){
  const {data}=await _sb.from('comunidad_contenido').select('id,data');
  _todas=(data||[])
    .map(r=>({...r.data,id:r.id}))
    .filter(c=>c.tipo==='pregunta'&&c.activo!==false&&c.texto);

  // Contadores por categoría
  const CATS=['todos','Identidad','Dinero','Cuerpo','Relaciones','Propósito','Consciencia'];
  CATS.forEach(cat=>{
    const el=document.getElementById('cnt-'+cat);
    if(el) el.textContent=cat==='todos'?_todas.length:_todas.filter(p=>p.matiz===cat).length;
  });

  if(!_todas.length){
    document.getElementById('preguntaTexto').textContent='Próximamente habrá preguntas para vos ✨';
    document.getElementById('btnNueva').style.display='none';
    return;
  }

  setCat('todos', false);
  nuevaPregunta();
  renderReflexiones();
}

function setCat(cat, mostrarNueva=true){
  _catActual=cat;
  _usadas.clear();
  _actual=null;

  // Actualizar botones
  document.querySelectorAll('.cat-btn').forEach(b=>{
    b.classList.toggle('active',b.dataset.matiz===cat);
  });

  // Rebuild pool
  _pool=cat==='todos'?[..._todas]:_todas.filter(p=>p.matiz===cat);

  // Badge de matiz
  const badge=document.getElementById('matizBadge');
  badge.textContent=cat==='todos'?'':`Dimensión: ${MATIZ_LABEL[cat]||cat}`;

  if(mostrarNueva&&_pool.length) nuevaPregunta();
}

function nuevaPregunta(){
  if(!_pool.length)return;
  const btn=document.getElementById('btnNueva');
  btn.classList.add('spinning');
  btn.disabled=true;

  if(_usadas.size>=_pool.length) _usadas.clear();
  const disponibles=_pool.filter(p=>!_usadas.has(p.id)&&p.id!==_actual?.id);
  const pool=disponibles.length?disponibles:_pool.filter(p=>p.id!==_actual?.id);
  const elegida=pool[Math.floor(Math.random()*pool.length)]||_pool[0];

  const el=document.getElementById('preguntaTexto');
  el.style.opacity='0';
  document.getElementById('refTexto').value='';
  document.getElementById('savedTag').style.display='none';

  setTimeout(()=>{
    _actual=elegida;
    _usadas.add(elegida.id);
    el.textContent=elegida.texto;
    el.classList.remove('loading');
    el.style.opacity='1';
    document.getElementById('contador').textContent=`${_usadas.size} de ${_pool.length} preguntas exploradas`;
    btn.classList.remove('spinning');
    btn.disabled=false;
  },300);
}

// Reflexiones guardadas en localStorage
function guardarReflexion(){
  const txt=document.getElementById('refTexto').value.trim();
  if(!txt||!_actual)return;
  const refs=JSON.parse(localStorage.getItem('lcpRefs')||'[]');
  refs.unshift({
    id:crypto.randomUUID(),
    preguntaId:_actual.id,
    pregunta:_actual.texto,
    matiz:_actual.matiz||'',
    texto:txt,
    fecha:new Date().toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit',year:'numeric'})
  });
  localStorage.setItem('lcpRefs',JSON.stringify(refs.slice(0,50)));
  document.getElementById('refTexto').value='';
  const tag=document.getElementById('savedTag');
  tag.style.display='inline';
  setTimeout(()=>tag.style.display='none',2500);
  renderReflexiones();
}

function borrarReflexion(id){
  const refs=JSON.parse(localStorage.getItem('lcpRefs')||'[]').filter(r=>r.id!==id);
  localStorage.setItem('lcpRefs',JSON.stringify(refs));
  renderReflexiones();
}

function renderReflexiones(){
  const refs=JSON.parse(localStorage.getItem('lcpRefs')||'[]');
  const el=document.getElementById('refsList');
  if(!refs.length){el.innerHTML='';return;}
  el.innerHTML=`
    <div style="font-size:12px;color:var(--muted);margin-bottom:10px;margin-top:8px;text-transform:uppercase;letter-spacing:.8px;font-weight:700">Mis reflexiones guardadas</div>
    ${refs.map(r=>`
      <div class="ref-item">
        <button class="ref-del" onclick="borrarReflexion('${r.id}')">✕</button>
        <div class="ref-q">${r.matiz?`[${r.matiz}] `:''}${r.pregunta}</div>
        <div class="ref-txt">${r.texto.replace(/\n/g,'<br>')}</div>
        <div class="ref-fecha">${r.fecha}</div>
      </div>`).join('')}
  `;
}

document.getElementById('preguntaTexto').style.transition='opacity .3s';
init();
</script>
</body>
</html>
