<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal del Programa — La Casa del Profit</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#C9A84C">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#06060A;--sidebar:#0E0D14;--card:#141320;--card2:#1C1A2E;--border:#2A2840;
  --gold:#C9A84C;--gl:#E8C96A;--gd:#8B6914;
  --text:#EDE5C8;--muted:#7A7260;--green:#3DAA6A;--red:#E05555;
  --prog:#C9A84C;
  --esp:#C77DFF;--men:#60A5FA;--fis:#4ADE80;--soc:#FBBF24;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}

/* ── LOGIN ── */
#loginScreen{display:flex;align-items:center;justify-content:center;min-height:100vh;
  background:radial-gradient(ellipse at 25% 25%,#1A1400 0%,#06060A 65%),
             radial-gradient(ellipse at 75% 75%,#0D0A1A 0%,transparent 50%);}
.lbox{background:var(--card);border:1px solid #3A3410;border-radius:24px;padding:48px 40px;width:420px;max-width:calc(100vw - 32px);
  box-shadow:0 0 60px rgba(201,168,76,.08),0 25px 60px rgba(0,0,0,.7);}
.llogo{text-align:center;margin-bottom:32px;}
.llogo .ico{font-size:52px;display:block;margin-bottom:12px;}
.llogo h1{font-size:20px;font-weight:800;color:var(--gl);letter-spacing:2px;}
.llogo .sub{font-size:11px;color:var(--gd);letter-spacing:1.5px;margin-top:4px;text-transform:uppercase;}
.fg{margin-bottom:16px;}
.fg label{display:block;font-size:11px;color:var(--muted);margin-bottom:7px;text-transform:uppercase;letter-spacing:.5px;font-weight:600;}
.fg input,.fg textarea{width:100%;padding:12px 14px;background:var(--card2);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:14px;outline:none;transition:border-color .2s;font-family:inherit;}
.fg input:focus,.fg textarea:focus{border-color:var(--gold);}
.fg textarea{min-height:80px;resize:vertical;line-height:1.6;}
.btn-login{width:100%;padding:14px;background:linear-gradient(135deg,var(--gold),var(--gd));border:none;border-radius:10px;color:#050401;font-size:15px;font-weight:800;cursor:pointer;letter-spacing:.5px;transition:opacity .2s;}
.btn-login:hover{opacity:.9;}
.btn-login:disabled{opacity:.5;cursor:not-allowed;}
.lerr{color:var(--red);font-size:12px;text-align:center;margin-top:10px;display:none;}

/* ── PROGRAM SELECTOR ── */
#progSelector{display:none;min-height:100vh;padding:40px 20px;
  background:radial-gradient(ellipse at 30% 20%,#1A1400 0%,#06060A 60%);}
.ps-header{text-align:center;margin-bottom:32px;}
.ps-header .ico{font-size:44px;display:block;margin-bottom:10px;}
.ps-header h2{font-size:20px;font-weight:800;color:var(--gl);margin-bottom:4px;}
.ps-header p{font-size:13px;color:var(--muted);}
.ps-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;max-width:960px;margin:0 auto;}
.ps-card{background:var(--card);border:1px solid #2A2840;border-radius:20px;padding:24px;cursor:pointer;transition:all .2s;position:relative;overflow:hidden;}
.ps-card:hover{border-color:rgba(201,168,76,.35);transform:translateY(-2px);box-shadow:0 12px 40px rgba(0,0,0,.4);}
.ps-card.completado{border-color:rgba(61,170,106,.2);}
.ps-card-stripe{position:absolute;top:0;left:0;right:0;height:3px;}
.ps-card-ico{font-size:36px;margin-bottom:10px;display:block;}
.ps-card-name{font-size:16px;font-weight:800;color:var(--gl);margin-bottom:3px;}
.ps-card-sub{font-size:11px;color:var(--muted);margin-bottom:14px;}
.ps-card-bar{height:5px;background:#1E1C10;border-radius:3px;overflow:hidden;margin-bottom:6px;}
.ps-card-bar-fill{height:100%;border-radius:3px;transition:width .6s ease;}
.ps-card-pct{font-size:11px;color:var(--muted);margin-bottom:14px;}
.ps-card-stats{display:flex;gap:14px;}
.ps-card-stat{text-align:center;}
.ps-card-stat .sv{font-size:16px;font-weight:800;color:var(--gl);}
.ps-card-stat .sl{font-size:9px;color:var(--muted);text-transform:uppercase;}
.ps-card-btn{width:100%;margin-top:16px;padding:10px;border:1px solid rgba(201,168,76,.3);border-radius:10px;background:rgba(201,168,76,.08);color:var(--gold);font-size:13px;font-weight:700;cursor:pointer;transition:all .2s;}
.ps-card-btn:hover{background:rgba(201,168,76,.18);}
.ps-bdg{position:absolute;top:16px;right:16px;font-size:9px;font-weight:700;letter-spacing:.5px;padding:3px 8px;border-radius:10px;text-transform:uppercase;}
.ps-bdg.activo{background:rgba(61,170,106,.15);color:var(--green);}
.ps-bdg.comp{background:rgba(201,168,76,.12);color:var(--gold);}

/* ── APP LAYOUT ── */
#app{display:none;}
.app-wrap{display:flex;min-height:100vh;}

/* ── SIDEBAR ── */
.sidebar{width:240px;background:var(--sidebar);border-right:1px solid #1E1C10;display:flex;flex-direction:column;position:fixed;height:100vh;overflow-y:auto;z-index:100;}
.s-head{padding:16px 14px 12px;border-bottom:1px solid #1E1C10;}
.s-prog-ico{font-size:30px;display:block;text-align:center;margin-bottom:5px;}
.s-prog-name{font-size:13px;font-weight:700;color:var(--gl);text-align:center;}
.s-prog-user{font-size:11px;color:var(--muted);text-align:center;margin-top:2px;}
.s-prog-bar{height:4px;background:#1E1C10;border-radius:2px;margin-top:8px;overflow:hidden;}
.s-prog-bar-fill{height:100%;border-radius:2px;transition:width .4s ease;}
.s-prog-pct{font-size:10px;color:var(--muted);text-align:center;margin-top:3px;}
.s-back{display:flex;align-items:center;gap:6px;padding:8px 12px;margin:8px 10px 0;border-radius:8px;font-size:11px;color:var(--muted);cursor:pointer;border:1px solid transparent;transition:all .15s;}
.s-back:hover{background:rgba(255,255,255,.04);border-color:var(--border);color:var(--text);}

.s-tabs{display:flex;flex-direction:column;gap:2px;padding:8px 8px 0;}
.s-tab{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;cursor:pointer;font-size:13px;color:var(--muted);transition:all .15s;border:1px solid transparent;}
.s-tab:hover{background:rgba(201,168,76,.06);color:var(--text);}
.s-tab.active{background:rgba(201,168,76,.12);color:var(--gl);border-color:rgba(201,168,76,.2);}
.s-tab .t-ico{font-size:15px;width:18px;text-align:center;flex-shrink:0;}

.s-sec-title{font-size:9px;font-weight:700;letter-spacing:1px;color:var(--muted);text-transform:uppercase;padding:10px 12px 4px;}
.week-item{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;cursor:pointer;font-size:12px;color:var(--muted);transition:all .15s;margin:1px 4px;border:1px solid transparent;}
.week-item:hover{background:rgba(201,168,76,.05);color:var(--text);}
.week-item.active{background:rgba(201,168,76,.1);color:var(--gl);border-color:rgba(201,168,76,.15);}
.week-item .w-num{font-size:9px;font-weight:700;width:19px;height:19px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#1E1C10;flex-shrink:0;}
.week-item.active .w-num{background:rgba(201,168,76,.25);color:var(--gl);}
.w-check{margin-left:auto;font-size:10px;color:var(--green);opacity:0;}
.week-item.done .w-check{opacity:1;}

.s-foot{padding:12px;border-top:1px solid #1E1C10;margin-top:auto;}
.s-foot-user{font-size:11px;color:var(--muted);margin-bottom:6px;}
.s-foot-user strong{color:var(--text);}
.btn-logout{width:100%;padding:8px;background:var(--card2);border:1px solid var(--border);border-radius:8px;color:var(--muted);font-size:12px;cursor:pointer;transition:all .15s;}
.btn-logout:hover{border-color:var(--red);color:var(--red);}

/* ── MAIN ── */
.main{margin-left:240px;flex:1;padding:28px 28px 60px;}

/* ── BLOCKS ── */
.sec-block{background:var(--card);border:1px solid #1E1C10;border-radius:16px;padding:20px;margin-bottom:14px;}
.sec-title{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;color:var(--gl);margin-bottom:14px;}
.sec-title .ico{font-size:17px;}
.sec-title .count{font-size:11px;color:var(--muted);font-weight:500;margin-left:auto;}

/* ── GENERAL TAB ── */
.gen-hero{background:linear-gradient(135deg,var(--card) 0%,var(--card2) 100%);border:1px solid #2A2840;border-radius:20px;padding:26px;margin-bottom:16px;position:relative;overflow:hidden;}
.gen-hero::before{content:'';position:absolute;top:-40px;right:-40px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,rgba(201,168,76,.07) 0%,transparent 70%);pointer-events:none;}
.gen-hero-ico{font-size:44px;margin-bottom:10px;display:block;}
.gen-hero-name{font-size:22px;font-weight:800;color:var(--gl);margin-bottom:3px;}
.gen-hero-sub{font-size:13px;color:var(--muted);line-height:1.6;}
.gen-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px;}
.gen-stat{background:rgba(0,0,0,.3);border-radius:10px;padding:12px;text-align:center;}
.gen-stat .sv{font-size:20px;font-weight:800;color:var(--gl);}
.gen-stat .sl{font-size:9px;color:var(--muted);text-transform:uppercase;margin-top:2px;}

.pq-block{background:var(--card);border:1px solid #1E1C10;border-radius:14px;padding:20px;margin-bottom:14px;}
.pq-label{font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);margin-bottom:6px;}
.pq-edit{display:flex;gap:8px;align-items:flex-start;}
.pq-edit .fg{flex:1;margin:0;}
.btn-pq{padding:8px 14px;background:rgba(201,168,76,.1);border:1px solid rgba(201,168,76,.2);border-radius:8px;color:var(--gold);font-size:12px;font-weight:700;cursor:pointer;transition:all .15s;white-space:nowrap;}
.btn-pq:hover{background:rgba(201,168,76,.2);}
.pq-saved{font-size:10px;color:var(--green);display:none;margin-top:4px;}

/* ── AVANCE TAB ── */
.avance-hero{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px;}
.av-kpi{border-radius:14px;padding:14px;text-align:center;border:1px solid;}
.av-kpi.esp{background:rgba(199,125,255,.07);border-color:rgba(199,125,255,.2);}
.av-kpi.men{background:rgba(96,165,250,.07);border-color:rgba(96,165,250,.2);}
.av-kpi.fis{background:rgba(74,222,128,.07);border-color:rgba(74,222,128,.2);}
.av-kpi.soc{background:rgba(251,191,36,.07);border-color:rgba(251,191,36,.2);}
.av-kpi .av-num{font-size:28px;font-weight:800;}
.av-kpi.esp .av-num{color:var(--esp);}
.av-kpi.men .av-num{color:var(--men);}
.av-kpi.fis .av-num{color:var(--fis);}
.av-kpi.soc .av-num{color:var(--soc);}
.av-kpi .av-lbl{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-top:3px;}
.av-kpi .av-sub{font-size:10px;color:var(--muted);margin-top:2px;}

/* Heatmap */
.heatmap-wrap{overflow-x:auto;}
.heatmap-row{display:flex;align-items:center;gap:4px;margin-bottom:5px;}
.heatmap-label{font-size:11px;color:var(--muted);min-width:130px;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.heatmap-cells{display:flex;gap:3px;flex:1;}
.hm-cell{width:16px;height:16px;border-radius:3px;flex-shrink:0;cursor:default;transition:transform .1s;}
.hm-cell:hover{transform:scale(1.3);}
.hm-cell.l0{background:#1E1C10;}
.hm-cell.l1{background:rgba(201,168,76,.25);}
.hm-cell.l2{background:rgba(201,168,76,.55);}
.hm-cell.l3{background:var(--gold);}
.hm-dow{width:16px;height:12px;border-radius:2px;flex-shrink:0;font-size:7px;color:var(--muted);text-align:center;line-height:12px;}

/* Progress bars by area */
.area-prog-row{margin-bottom:12px;}
.area-prog-label{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;}
.area-prog-name{font-size:12px;font-weight:700;display:flex;align-items:center;gap:6px;}
.area-prog-pct{font-size:11px;color:var(--muted);}
.area-prog-bar{height:8px;background:#1E1C10;border-radius:4px;overflow:hidden;}
.area-prog-fill{height:100%;border-radius:4px;transition:width .6s ease;}

/* Achievement badges */
.badges-grid{display:flex;flex-wrap:wrap;gap:10px;}
.badge{background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:10px 14px;display:flex;align-items:center;gap:10px;transition:all .2s;}
.badge.unlocked{border-color:rgba(201,168,76,.3);background:rgba(201,168,76,.06);}
.badge.locked{opacity:.35;filter:grayscale(1);}
.badge-ico{font-size:22px;}
.badge-name{font-size:12px;font-weight:700;color:var(--text);}
.badge-desc{font-size:10px;color:var(--muted);}

/* Materials list */
.mat-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.04);}
.mat-item:last-child{border-bottom:none;}
.mat-ico{width:32px;height:32px;border-radius:7px;background:#1E1C10;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
.mat-name{font-size:12px;color:var(--text);font-weight:600;}
.mat-type{font-size:10px;color:var(--muted);}
.mat-link{margin-left:auto;padding:5px 10px;border-radius:7px;background:rgba(201,168,76,.1);border:1px solid rgba(201,168,76,.2);color:var(--gold);font-size:11px;font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap;}
.mat-link:hover{background:rgba(201,168,76,.2);}

/* ── SEMANAS TAB ── */
.week-header{margin-bottom:18px;}
.week-num-badge{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;margin-bottom:8px;background:rgba(201,168,76,.12);color:var(--gold);}
.week-title{font-size:22px;font-weight:800;color:var(--gl);margin-bottom:4px;}
.week-desc{font-size:13px;color:var(--muted);line-height:1.6;max-width:580px;}

.area-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px;}
.area-card{background:var(--card);border-radius:14px;padding:16px;border:1px solid;}
.area-card.esp{border-color:rgba(199,125,255,.2);background:linear-gradient(135deg,#141320 0%,#1a0e2e 100%);}
.area-card.men{border-color:rgba(96,165,250,.2);background:linear-gradient(135deg,#141320 0%,#0e1a2e 100%);}
.area-card.fis{border-color:rgba(74,222,128,.2);background:linear-gradient(135deg,#141320 0%,#0e2a1a 100%);}
.area-card.soc{border-color:rgba(251,191,36,.2);background:linear-gradient(135deg,#141320 0%,#2a1e0e 100%);}
.area-header{display:flex;align-items:center;gap:8px;margin-bottom:12px;}
.area-ico{font-size:18px;}
.area-name{font-size:12px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;}
.area-card.esp .area-name{color:var(--esp);}
.area-card.men .area-name{color:var(--men);}
.area-card.fis .area-name{color:var(--fis);}
.area-card.soc .area-name{color:var(--soc);}
.area-count{margin-left:auto;font-size:10px;color:var(--muted);}

.desafio-item{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.04);}
.desafio-item:last-child{border-bottom:none;padding-bottom:0;}
.desafio-item:first-child{padding-top:0;}
.d-check{width:19px;height:19px;border:2px solid var(--border);border-radius:5px;cursor:pointer;flex-shrink:0;margin-top:2px;display:flex;align-items:center;justify-content:center;transition:all .2s;}
.d-check.done{border-color:var(--green);background:var(--green);}
.d-check.done::after{content:'✓';color:white;font-size:10px;font-weight:700;}
.d-text{font-size:12px;color:var(--text);line-height:1.5;cursor:pointer;transition:opacity .2s;flex:1;}
.d-text.done{opacity:.4;text-decoration:line-through;}
.empty-msg{font-size:11px;color:var(--muted);font-style:italic;padding:4px 0;}

.habito-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.04);}
.habito-row:last-child{border-bottom:none;}
.habito-name{font-size:12px;color:var(--text);flex:1;min-width:0;}
.habito-freq{font-size:10px;color:var(--muted);}
.habito-dots{display:flex;gap:3px;flex-shrink:0;}
.h-dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--border);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:7px;color:var(--muted);transition:all .2s;flex-shrink:0;}
.h-dot.today{border-color:var(--gold);color:var(--gold);}
.h-dot.done{border-color:var(--green);background:var(--green);color:white;}
.habito-streak{font-size:11px;color:var(--muted);min-width:28px;text-align:right;}

.nota-wrap textarea{width:100%;min-height:90px;background:var(--card2);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:13px;padding:12px;outline:none;resize:vertical;font-family:inherit;line-height:1.6;transition:border-color .2s;}
.nota-wrap textarea:focus{border-color:var(--gold);}
.nota-save-row{display:flex;align-items:center;gap:10px;margin-top:8px;}
.btn-save-nota{padding:8px 16px;background:linear-gradient(135deg,var(--gold),var(--gd));border:none;border-radius:8px;color:#050401;font-size:13px;font-weight:700;cursor:pointer;transition:opacity .2s;}
.btn-save-nota:hover{opacity:.9;}
.nota-saved{font-size:11px;color:var(--green);display:none;}

/* ── CALENDARIO ── */
.cal-wrap{background:var(--card);border:1px solid #1E1C10;border-radius:16px;overflow:hidden;}
.cal-header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid #1E1C10;}
.cal-month{font-size:15px;font-weight:700;color:var(--gl);}
.cal-nav{display:flex;gap:5px;}
.cal-nav button{width:30px;height:30px;border:1px solid var(--border);border-radius:7px;background:var(--card2);color:var(--muted);cursor:pointer;font-size:14px;line-height:1;transition:all .15s;}
.cal-nav button:hover{border-color:var(--gold);color:var(--gl);}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);}
.cal-dow{text-align:center;font-size:9px;font-weight:700;letter-spacing:.5px;color:var(--muted);text-transform:uppercase;padding:8px 2px;border-bottom:1px solid #1E1C10;}
.cal-day{min-height:74px;padding:5px;border-right:1px solid #1E1C10;border-bottom:1px solid #1E1C10;position:relative;cursor:pointer;transition:background .15s;}
.cal-day:nth-child(7n){border-right:none;}
.cal-day:hover{background:rgba(201,168,76,.04);}
.cal-day.other-month{opacity:.28;}
.cal-day.selected{background:rgba(201,168,76,.07);outline:1px solid rgba(201,168,76,.3);outline-offset:-1px;}
.cd-num-wrap{display:flex;align-items:center;justify-content:center;margin-bottom:3px;}
.cd-num{font-size:11px;font-weight:600;color:var(--muted);width:22px;height:22px;display:flex;align-items:center;justify-content:center;border-radius:50%;}
.cal-day.today .cd-num{background:var(--gold);color:#050401;font-weight:800;}
.cal-day.start-day .cd-num{background:rgba(74,222,128,.25);color:var(--fis);font-weight:800;}
.cal-day.end-day .cd-num{background:rgba(199,125,255,.25);color:var(--esp);font-weight:800;}
.cal-day.in-range{background:rgba(201,168,76,.03);}
.cd-markers{display:flex;gap:2px;margin-bottom:2px;flex-wrap:wrap;}
.cd-marker{font-size:8px;padding:1px 5px;border-radius:3px;font-weight:700;white-space:nowrap;}
.cd-marker.start{background:rgba(74,222,128,.2);color:var(--fis);}
.cd-marker.end{background:rgba(199,125,255,.2);color:var(--esp);}
.cd-ses{display:flex;flex-direction:column;gap:2px;}
.cd-ses-pill{font-size:8px;padding:2px 5px;border-radius:3px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cd-ses-pill.done{background:rgba(61,170,106,.2);color:var(--green);}
.cd-ses-pill.pend{background:rgba(201,168,76,.15);color:var(--gold);}
.cd-ses-pill.can{background:rgba(224,85,85,.15);color:var(--red);}

}

<body>

<script>
const SUPA_URL = 'https://vffmnyjjawvvctcqzkvj.supabase.co';
const SUPA_KEY = 'sb_publishable_A1rJIiXHSg6TQYT2gKQHUw_UTwmS76t';
const SAVE_FN  = '/api/save-progreso';

let _sb;
let curSer       = null;
let curInsc      = null;
let curProg      = null;
let curSemIdx    = 0;
let curTab       = 'general';
let progreso     = {};
let calDate      = new Date();
let selDay       = null;
let allSessions  = [];
let allInscList  = [];
let allProgsList = [];

// ── Helpers ──────────────────────────────────────────────────────────────────
const showLoader = () => document.getElementById('loader').style.display='flex';
const hideLoader = () => document.getElementById('loader').style.display='none';
let _toastTimer;
function toast(msg,dur=2800){
  const el=document.getElementById('toast');
  el.textContent=msg;el.classList.add('show');
  clearTimeout(_toastTimer);_toastTimer=setTimeout(()=>el.classList.remove('show'),dur);
}
function today(){ return new Date().toISOString().slice(0,10); }
function lastNDays(n){
  const days=[];
  for(let i=n-1;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);days.push(d.toISOString().slice(0,10));}
  return days;
}
function lastNWeeks(weeks){
  const days=[];
  const n=weeks*7;
  for(let i=n-1;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);days.push(d.toISOString().slice(0,10));}
  return days;
}
function fmtDate(d){return d?new Date(d+'T12:00:00').toLocaleDateString('es-AR',{day:'2-digit',month:'short'}):'-';}
function fmtDateLong(d){return d?new Date(d+'T12:00:00').toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long'}):'-';}
function getProgreso(semIdx){return progreso[String(semIdx)]||(progreso[String(semIdx)]={});}
function semanaCompletada(semIdx){
  const sem=(curInsc.semanas||[])[semIdx];if(!sem)return false;
  const p=getProgreso(semIdx);const des=sem.desafios||[];if(!des.length)return false;
  const ds=p.desafios||{};return des.every(d=>ds[d.id]);
}
function calcProgress(){
  const total=(curInsc.semanas||[]).length;if(!total)return 0;
  let done=0;for(let i=0;i<total;i++)if(semanaCompletada(i))done++;
  return Math.round(done/total*100);
}
function lighten(hex){try{const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return `rgb(${Math.min(255,r+50)},${Math.min(255,g+50)},${Math.min(255,b+50)})`;}catch{return hex;}}
function darken(hex){try{const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return `rgb(${Math.max(0,r-60)},${Math.max(0,g-60)},${Math.max(0,b-60)})`;}catch{return hex;}}
function calcStreak(dates){
  if(!dates||!dates.length)return 0;let s=0;let d=new Date();
  while(s<365){const key=d.toISOString().slice(0,10);if(dates.includes(key)){s++;d.setDate(d.getDate()-1);}else break;}return s;
}
function unwrap(rows){return rows.map(r=>({id:r.id,...(r.data||{})}));}
async function sbSelect(table,filters={}){
  let q=_sb.from(table).select('id,data');
  for(const [k,v] of Object.entries(filters))q=q.eq(`data->>${k}`,v);
  const {data,error}=await q;if(error)throw error;return unwrap(data||[]);
}

// ── LOGIN ────────────────────────────────────────────────────────────────────
async function doLogin(){
  const email=document.getElementById('lEmail').value.trim().toLowerCase();
  const code=document.getElementById('lCode').value.trim();
  const errEl=document.getElementById('lerr');
  errEl.style.display='none';
  if(!email||!code){errEl.textContent='Completá email y código.';errEl.style.display='block';return;}
  document.getElementById('btnLogin').disabled=true;showLoader();
  try{
    _sb=supabase.createClient(SUPA_URL,SUPA_KEY);
    const seres=await sbSelect('seres',{email});
    if(!seres.length)throw new Error('not_found');
    const ser=seres[0];

    const inscList=await sbSelect('inscripciones',{serId:ser.id});
    const matchInsc=inscList.find(i=>String(i.code||'').trim()===code);
    if(!matchInsc)throw new Error('bad_code');

    const progs=await sbSelect('programas',{});
    allInscList=inscList;allProgsList=progs;

    try{allSessions=await sbSelect('sessions',{serId:ser.id});}catch{allSessions=[];}

    sessionStorage.setItem('pp_ser',JSON.stringify(ser));
    sessionStorage.setItem('pp_all_insc',JSON.stringify(inscList));
    sessionStorage.setItem('pp_all_progs',JSON.stringify(progs));
    sessionStorage.setItem('pp_sessions',JSON.stringify(allSessions));
    sessionStorage.setItem('pp_code',code);

    document.getElementById('loginScreen').style.display='none';

    if(inscList.length===1){
      const prog=progs.find(p=>p.id===matchInsc.programaId);
      if(!prog)throw new Error('no_prog');
      launchApp(ser,matchInsc,prog);
    }else{
      showSelector(ser,inscList,progs);
    }
  }catch(e){
    errEl.textContent=e.message==='not_found'||e.message==='bad_code'||e.message==='no_prog'
      ?'Email o código incorrecto. Contactá al equipo si tenés dudas.'
      :'Error de conexión. Intentá de nuevo.';
    errEl.style.display='block';console.error(e);
  }finally{hideLoader();document.getElementById('btnLogin').disabled=false;}
}

function doLogout(){
  ['pp_ser','pp_all_insc','pp_all_progs','pp_sessions','pp_code'].forEach(k=>sessionStorage.removeItem(k));
  document.getElementById('app').style.display='none';
  document.getElementById('progSelector').style.display='none';
  document.getElementById('loginScreen').style.display='flex';
  curSer=curInsc=curProg=null;progreso={};allSessions=[];allInscList=[];allProgsList=[];
}

// ── PROGRAM SELECTOR ─────────────────────────────────────────────────────────
function showSelector(ser,inscList,progs){
  curSer=ser;
  document.getElementById('psUserName').textContent='Hola, '+ser.nombre+' 👋';
  document.getElementById('psUserSub').textContent=inscList.length===1?'Tu programa activo':'Elegí el programa que querés ver';

  document.getElementById('psGrid').innerHTML=inscList.map(insc=>{
    const prog=progs.find(p=>p.id===insc.programaId)||{nombre:'Programa',ico:'📚',col:'#C9A84C'};
    const col=prog.col||'#C9A84C';
    const prgrs=insc.progreso||{};
    const semanas=insc.semanas||[];
    const total=semanas.length;
    let done=0;
    // quick progress calc without setting global state
    for(let i=0;i<total;i++){
      const p=prgrs[String(i)]||{};
      const des=semanas[i].desafios||[];
      if(des.length&&des.every(d=>(p.desafios||{})[d.id]))done++;
    }
    const pct=total?Math.round(done/total*100):0;
    const isComp=insc.estado==='completado'||pct===100;
    const notas=Object.values(prgrs).filter(p=>p.nota&&p.nota.trim()).length;
    const sesComp=(allSessions||[]).filter(s=>s.inscId===insc.id&&(s.estado||'').toLowerCase().includes('comp')).length;
    return `<div class="ps-card ${isComp?'completado':''}" onclick="selectProgram('${insc.id}')">
      <div class="ps-card-stripe" style="background:${col}"></div>
      <span class="ps-bdg ${isComp?'comp':'activo'}">${isComp?'Completado':'Activo'}</span>
      <span class="ps-card-ico">${prog.ico||'📚'}</span>
      <div class="ps-card-name">${prog.nombre}</div>
      <div class="ps-card-sub">${insc.fechaInicio?'Inicio: '+fmtDate(insc.fechaInicio):'Sin fecha de inicio'}</div>
      <div class="ps-card-bar"><div class="ps-card-bar-fill" style="width:${pct}%;background:${col}"></div></div>
      <div class="ps-card-pct">${pct}% completado · ${done}/${total} semanas</div>
      <div class="ps-card-stats">
        <div class="ps-card-stat"><div class="sv">${sesComp}</div><div class="sl">Sesiones</div></div>
        <div class="ps-card-stat"><div class="sv">${notas}</div><div class="sl">Reflexiones</div></div>
        <div class="ps-card-stat"><div class="sv">${total}</div><div class="sl">Semanas</div></div>
      </div>
      <button class="ps-card-btn">${isComp?'📖 Ver historial':'▶ Continuar programa'}</button>
    </div>`;
  }).join('');

  document.getElementById('progSelector').style.display='block';
}

function selectProgram(inscId){
  const insc=allInscList.find(i=>i.id===inscId);
  if(!insc)return;
  const prog=allProgsList.find(p=>p.id===insc.programaId);
  if(!prog)return;
  document.getElementById('progSelector').style.display='none';
  launchApp(curSer,insc,prog);
}

function goToSelector(){
  document.getElementById('app').style.display='none';
  showSelector(curSer,allInscList,allProgsList);
}

// ── LAUNCH ───────────────────────────────────────────────────────────────────
function launchApp(ser,insc,prog){
  curSer=ser;curInsc=insc;curProg=prog;progreso=insc.progreso||{};
  const col=prog.col||'#C9A84C';
  document.documentElement.style.setProperty('--prog',col);
  document.documentElement.style.setProperty('--gold',col);
  document.documentElement.style.setProperty('--gl',lighten(col));
  document.documentElement.style.setProperty('--gd',darken(col));
  document.getElementById('sProgIco').textContent=prog.ico||'📚';
  document.getElementById('sProgName').textContent=prog.nombre;
  document.getElementById('sProgUser').textContent=ser.nombre;
  document.getElementById('sfUser').textContent=ser.nombre;
  // Show back button if multiple programs
  document.getElementById('sBackBtn').style.display=allInscList.length>1?'flex':'none';
  curSemIdx=Math.max(0,(insc.semanaActual||1)-1);
  if(curSemIdx>=(insc.semanas||[]).length)curSemIdx=0;
  updateProgressBar();
  document.getElementById('progSelector').style.display='none';
  document.getElementById('app').style.display='block';
  switchTab('general');window.scrollTo(0,0);
}

// ── TAB SWITCHING ────────────────────────────────────────────────────────────
function switchTab(tab){
  if(curTab==='semanas')saveNotaImmediate();
  curTab=tab;
  ['general','avance','semanas','calendario'].forEach(t=>{
    const el=document.getElementById('tab-'+t);if(el)el.classList.toggle('active',t===tab);
  });
  const ww=document.getElementById('weekListWrap');
  const sp=document.getElementById('sidebarSpacer');
  if(tab==='semanas'){ww.style.display='flex';sp.style.display='none';renderWeekList();}
  else{ww.style.display='none';sp.style.display='block';}
  if(tab==='general')renderGeneral();
  else if(tab==='avance')renderAvance();
  else if(tab==='semanas')renderSemana(curSemIdx);
  else if(tab==='calendario')renderCalendario();
  window.scrollTo(0,0);
}

function updateProgressBar(){
  const pct=calcProgress();
  const fill=document.getElementById('sProgBarFill');
  const pctEl=document.getElementById('sProgPct');
  if(fill){fill.style.width=pct+'%';fill.style.background=curProg?.col||'#C9A84C';}
  if(pctEl)pctEl.textContent=pct+'% completado';
}

// ══════════════════════════════════════════════════════════════════════════════
// TAB: GENERAL
// ══════════════════════════════════════════════════════════════════════════════
function renderGeneral(){
  const semanas=curInsc.semanas||[];
  const doneSem=semanas.filter((_,i)=>semanaCompletada(i)).length;
  const progSes=allSessions.filter(s=>s.serId===curSer.id||s.ser===curSer.nombre);
  const doneSes=progSes.filter(s=>(s.estado||'').toLowerCase().includes('comp')).length;
  let bestStreak=0;
  semanas.forEach((_,i)=>{
    const p=getProgreso(i);
    (semanas[i].habitos||[]).forEach(h=>{
      const hid=h.id||h.texto||h;const dates=(p.habitos||{})[hid]||[];
      const s=calcStreak(dates);if(s>bestStreak)bestStreak=s;
    });
  });
  const sesInc=curProg.sesionesIncluidas_v2||{};
  const totalInc=Object.values(sesInc).reduce((a,n)=>a+n,0);
  const paraQue=curInsc.paraQue||'';
  const resultado=curInsc.resultadoDeseado||'';
  const durLine=[]
  if(curProg.meses)durLine.push(curProg.meses+' mes'+(curProg.meses>1?'es':''));
  if(curProg.semanas_dur)durLine.push(curProg.semanas_dur+' sem.');
  document.getElementById('mainContent').innerHTML=`
    <div class="gen-hero">
      <span class="gen-hero-ico">${curProg.ico||'📚'}</span>
      <div class="gen-hero-name">${curProg.nombre}</div>
      <div class="gen-hero-sub">${curProg.descripcion||curProg.objetivo||''}</div>
      ${durLine.length?`<div style="font-size:11px;color:var(--muted);margin-top:6px">⏱ Duración: ${durLine.join(' · ')}</div>`:''}
      <div class="gen-stats">
        <div class="gen-stat"><div class="sv">${doneSem}/${semanas.length}</div><div class="sl">Semanas</div></div>
        <div class="gen-stat"><div class="sv">${doneSes}${totalInc?'/'+totalInc:''}</div><div class="sl">Sesiones</div></div>
        <div class="gen-stat"><div class="sv">${bestStreak?'🔥'+bestStreak:'—'}</div><div class="sl">Mejor racha</div></div>
      </div>
    </div>

    <div class="pq-block">
      <div class="sec-title" style="margin-bottom:8px"><span class="ico">🌟</span> Mi Para Qué</div>
      <div class="pq-label">¿Por qué estoy haciendo este programa?</div>
      <div class="pq-edit"><div class="fg"><textarea id="pqText" placeholder="Escribí tu propósito profundo…">${paraQue}</textarea></div>
      <button class="btn-pq" onclick="savePQ()">Guardar</button></div>
      <div class="pq-saved" id="pqSaved">✓ Guardado</div>
    </div>

    <div class="pq-block">
      <div class="sec-title" style="margin-bottom:8px"><span class="ico">🎯</span> Resultado Deseado</div>
      <div class="pq-label">¿Cómo te imaginás al terminar el programa?</div>
      <div class="pq-edit"><div class="fg"><textarea id="rdText" placeholder="Describí con detalle cómo querés estar…">${resultado}</textarea></div>
      <button class="btn-pq" onclick="saveRD()">Guardar</button></div>
      <div class="pq-saved" id="rdSaved">✓ Guardado</div>
    </div>

    ${totalInc?`<div class="sec-block">
      <div class="sec-title"><span class="ico">✨</span> Sesiones incluidas</div>
      <div style="display:flex;flex-wrap:wrap;gap:8px">
        ${Object.entries(sesInc).map(([nom,qty])=>`
          <div style="background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:7px 11px;display:flex;align-items:center;gap:7px">
            <span style="font-size:12px;color:var(--text)">${nom}</span>
            <span style="font-size:11px;font-weight:800;color:var(--gl)">${qty}x</span>
          </div>`).join('')}
      </div>
    </div>`:''}
  `;
}
function savePQ(){
  const txt=document.getElementById('pqText').value;curInsc.paraQue=txt;
  sessionStorage.setItem('pp_all_insc',JSON.stringify(allInscList));
  saveProgress(()=>{const el=document.getElementById('pqSaved');if(el){el.style.display='block';setTimeout(()=>el.style.display='none',2000);}});
}
function saveRD(){
  const txt=document.getElementById('rdText').value;curInsc.resultadoDeseado=txt;
  sessionStorage.setItem('pp_all_insc',JSON.stringify(allInscList));
  saveProgress(()=>{const el=document.getElementById('rdSaved');if(el){el.style.display='block';setTimeout(()=>el.style.display='none',2000);}});
}

// ══════════════════════════════════════════════════════════════════════════════
// TAB: MI AVANCE
// ══════════════════════════════════════════════════════════════════════════════
const AREAS=[
  {key:'espiritual',label:'ESPIRITUAL',ico:'🌀',cls:'esp',col:'var(--esp)'},
  {key:'mental',    label:'MENTAL',    ico:'🧠',cls:'men',col:'var(--men)'},
  {key:'fisica',    label:'FÍSICA',    ico:'💪',cls:'fis',col:'var(--fis)'},
  {key:'social',    label:'SOCIAL',    ico:'🤝',cls:'soc',col:'var(--soc)'},
];

function renderAvance(){
  const semanas=curInsc.semanas||[];

  // ── Collect all desafios / habitos / materiales across weeks, grouped by area
  const areaData={espiritual:{desTotal:0,desDone:0},mental:{desTotal:0,desDone:0},fisica:{desTotal:0,desDone:0},social:{desTotal:0,desDone:0}};
  const areaUnknown={desTotal:0,desDone:0};
  const habMap={};
  const matList=[];

function buildHeatmap(habList){
  if(!habList.length)return '';
  const days=lastNWeeks(12); // 84 days
  return habList.map(h=>{
    return `<div class="heatmap-row">
      <div class="heatmap-label" title="${h.texto}">${h.texto}</div>
      <div class="heatmap-cells">${days.map(d=>{
        const done=h.dates.includes(d);
        // get streak level for color intensity
        const level=done?'l3':'l0';
        return `<div class="hm-cell ${level}" title="${fmtDate(d)}${done?' ✓':''}"></div>`;
      }).join('')}</div>
    </div>`;
  }).join('');
}

function buildBadges(habList,doneDesTotal,totalDesAll){
  // Calc max streak
  let maxStreak=0;
  habList.forEach(h=>{const s=calcStreak(h.dates);if(s>maxStreak)maxStreak=s;});
  const totalHabDone=habList.reduce((a,h)=>a+h.dates.length,0);
  const pct=totalDesAll?Math.round(doneDesTotal/totalDesAll*100):0;
  return [
    {ico:'🌱',name:'Primera semilla',  desc:'Completaste tu primer desafío',ok:doneDesTotal>=1},
    {ico:'🔥',name:'3 días seguidos',  desc:'Mantuviste un hábito 3 días',ok:maxStreak>=3},
    {ico:'⚡',name:'Semana perfecta',  desc:'7 días seguidos de un hábito',ok:maxStreak>=7},
    {ico:'🏔',name:'Constancia doble', desc:'14 días consecutivos',ok:maxStreak>=14},
    {ico:'💎',name:'Un mes entero',    desc:'30 días seguidos de un hábito',ok:maxStreak>=30},
    {ico:'🎯',name:'Mitad del camino', desc:'50% de desafíos completados',ok:pct>=50},
    {ico:'🏅',name:'Todo completado',  desc:'100% de desafíos',ok:pct>=100},
    {ico:'📖',name:'Explorador',       desc:'Abriste 5 materiales',ok:false}, // needs tracking
    {ico:'✍️',name:'Reflexivo',        desc:'Escribiste 3 reflexiones',ok:Object.keys(progreso).filter(k=>(progreso[k].nota||'').trim()).length>=3},
    {ico:'🌀',name:'Transformador',    desc:'100 días de hábitos acumulados',ok:totalHabDone>=100},
  ];
}

  document.getElementById('weekList').innerHTML=semanas.map((s,i)=>{

function toggleDesafio(dId,semIdx){
  const p=getProgreso(semIdx);if(!p.desafios)p.desafios={};
  p.desafios[dId]=!p.desafios[dId];
  const done=p.desafios[dId];
  const dc=document.getElementById('dc_'+dId);const dt=document.getElementById('dt_'+dId);
  if(dc)dc.className='d-check'+(done?' done':'');
  if(dt)dt.className='d-text'+(done?' done':'');
  updateProgressBar();renderWeekList();saveProgress();
}

function renderHabitos(hab,p,semIdx){
  const days=lastNDays(7);const hs=p.habitos||{};
  return hab.map(h=>{
    const hid=h.id||h.texto||h;const dates=hs[hid]||[];const streak=calcStreak(dates);
    const dotsHTML=days.map(d=>{
      const isToday=d===today();const isDone=dates.includes(d);
      return `<div class="h-dot ${isToday?'today':''} ${isDone?'done':''}" onclick="toggleHabito('${hid}','${d}',${semIdx})" title="${fmtDate(d)}">${isToday&&!isDone?'●':''}</div>`;
    }).join('');
    return `<div class="habito-row">
      <div style="flex:1;min-width:0"><div class="habito-name">${h.texto||h.nombre||h}</div>${h.frecuencia?`<div class="habito-freq">${h.frecuencia}</div>`:''}</div>
      <div class="habito-dots" id="hd_${hid}">${dotsHTML}</div>
      <div class="habito-streak" id="hs_${hid}">${streak?'🔥'+streak:''}</div>
    </div>`;
  }).join('');
}

function toggleHabito(hId,date,semIdx){
  const p=getProgreso(semIdx);if(!p.habitos)p.habitos={};if(!p.habitos[hId])p.habitos[hId]=[];
  const arr=p.habitos[hId];const idx=arr.indexOf(date);if(idx>-1)arr.splice(idx,1);else arr.push(date);
  const days=lastNDays(7);
  const dotsEl=document.getElementById('hd_'+hId);
  if(dotsEl)dotsEl.innerHTML=days.map(d=>{
    const isToday=d===today();const isDone=arr.includes(d);
    return `<div class="h-dot ${isToday?'today':''} ${isDone?'done':''}" onclick="toggleHabito('${hId}','${d}',${semIdx})" title="${fmtDate(d)}">${isToday&&!isDone?'●':''}</div>`;
  }).join('');
  const streak=calcStreak(arr);
  const strEl=document.getElementById('hs_'+hId);if(strEl)strEl.textContent=streak?'🔥'+streak:'';
  saveProgress();
}

function iconForType(t){
  if(!t)return '📄';t=t.toLowerCase();
  if(t.includes('video')||t.includes('yt'))return '🎬';
  if(t.includes('audio')||t.includes('mp3'))return '🎧';
  if(t.includes('pdf'))return '📕';
  if(t.includes('ejercicio')||t.includes('práctica'))return '✏️';
  if(t.includes('meditaci'))return '🧘';
  return '📄';
}
function renderMateriales(mat){
  return mat.map(m=>`<div class="mat-item">
    <div class="mat-ico">${iconForType(m.tipo)}</div>
    <div><div class="mat-name">${m.nombre||m.titulo||'Material'}</div>${m.tipo?`<div class="mat-type">${m.tipo}</div>`:''}</div>
    ${m.url?`<a class="mat-link" href="${m.url}" target="_blank" rel="noopener">Abrir ↗</a>`:''}
  </div>`).join('');
}

function saveNota(){

  const p=getProgreso(curSemIdx);p.nota=txt;
  saveProgress(()=>{const el=document.getElementById('notaSaved');if(el){el.style.display='inline';setTimeout(()=>el.style.display='none',2000);}});

function saveNotaImmediate(){const el=document.getElementById('notaText');if(!el)return;getProgreso(curSemIdx).nota=el.value;}

function renderCalendario(){
  const MESES=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  const DIAS=['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
  const y=calDate.getFullYear();const m=calDate.getMonth();

  // Sessions keyed by date
  const sesMap={};
  const allSes=[
    ...allSessions,
    ...(curInsc.semanas||[]).flatMap(sem=>sem.sesiones||[])
  ];
  allSes.forEach(s=>{
    const fecha=(s.fecha||s.date||'');if(!fecha)return;
    const key=fecha.slice(0,10);if(!sesMap[key])sesMap[key]=[];sesMap[key].push(s);
  });

  // Start / end dates
  const startDate=curInsc.fechaInicio||null;
  let endDate=curInsc.fechaFin||null;
  if(!endDate&&startDate){
    // Compute from program duration
    const meses=parseFloat(curProg.meses)||0;const semanas=parseInt(curProg.semanas_dur)||0;
    const totalDays=Math.round(meses*30)+semanas*7;
    if(totalDays>0){
      const d=new Date(startDate+'T12:00:00');d.setDate(d.getDate()+totalDays);
      endDate=d.toISOString().slice(0,10);
    }
  }

  const firstDay=new Date(y,m,1);const lastDay=new Date(y,m+1,0);
  let dow=firstDay.getDay();dow=dow===0?6:dow-1;
  const todayStr=today();const cells=[];

  for(let i=0;i<dow;i++){const d=new Date(y,m,1-dow+i);cells.push({date:d.toISOString().slice(0,10),day:d.getDate(),other:true});}
  for(let d=1;d<=lastDay.getDate();d++){const dt=new Date(y,m,d);cells.push({date:dt.toISOString().slice(0,10),day:d,other:false});}
  let extra=cells.length%7;if(extra>0)extra=7-extra;
  for(let i=1;i<=extra;i++){const dt=new Date(y,m+1,i);cells.push({date:dt.toISOString().slice(0,10),day:i,other:true});}

  const calHTML=cells.map(c=>{
    const isToday=c.date===todayStr;
    const isSel=c.date===selDay;
    const isStart=c.date===startDate;
    const isEnd=c.date===endDate;
    const inRange=startDate&&endDate&&c.date>startDate&&c.date<endDate&&!c.other;
    const ses=sesMap[c.date]||[];
    const pillsHTML=ses.slice(0,2).map(s=>{
      const est=(s.estado||'pendiente').toLowerCase();
      const cls=est.includes('comp')?'done':est.includes('can')?'can':'pend';
      return `<div class="cd-ses-pill ${cls}">${s.sesion||s.nombre||s.tipo||'Sesión'}</div>`;
    }).join('');
    const moreBadge=ses.length>2?`<div style="font-size:7px;color:var(--muted);padding:1px 3px">+${ses.length-2}</div>`:'';
    const markersHTML=`${isStart?'<div class="cd-marker start">Inicio</div>':''}${isEnd?'<div class="cd-marker end">Fin</div>':''}`;
    return `<div class="cal-day ${c.other?'other-month':''} ${isToday?'today':''} ${isStart?'start-day':''} ${isEnd?'end-day':''} ${inRange?'in-range':''} ${isSel?'selected':''}"
      onclick="selectDay('${c.date}')">
      <div class="cd-num-wrap"><div class="cd-num">${c.day}</div></div>
      ${markersHTML?`<div class="cd-markers">${markersHTML}</div>`:''}
      <div class="cd-ses">${pillsHTML}${moreBadge}</div>
    </div>`;
  }).join('');

  const selDaySes=selDay&&sesMap[selDay]?sesMap[selDay]:[];

  document.getElementById('mainContent').innerHTML=`
    <div style="margin-bottom:14px">
      <div style="font-size:20px;font-weight:800;color:var(--gl);margin-bottom:3px">🗓 Calendario</div>
      <div style="font-size:13px;color:var(--muted)">
        ${startDate?`Inicio: <strong style="color:var(--fis)">${fmtDate(startDate)}</strong>`:''} ${endDate?`· Fin estimado: <strong style="color:var(--esp)">${fmtDate(endDate)}</strong>`:''}
      </div>
    </div>

    <div class="cal-wrap">
      <div class="cal-header">
        <div class="cal-month">${MESES[m]} ${y}</div>
        <div class="cal-nav">
          <button onclick="calNav(-1)">‹</button>
          <button onclick="calNav(0)" style="font-size:10px;width:auto;padding:0 8px">Hoy</button>
          <button onclick="calNav(1)">›</button>
        </div>
      </div>
      <div class="cal-grid">
        ${DIAS.map(d=>`<div class="cal-dow">${d}</div>`).join('')}
        ${calHTML}
      </div>
    </div>

    ${selDay?`<div class="day-detail">
      <div class="dd-title">${fmtDateLong(selDay)}${selDaySes.length?' — '+selDaySes.length+' sesión'+(selDaySes.length>1?'es':''):'  —  Sin sesiones'}</div>
      ${selDay===startDate?`<div style="display:inline-flex;align-items:center;gap:5px;background:rgba(74,222,128,.1);color:var(--fis);font-size:11px;font-weight:700;padding:4px 10px;border-radius:8px;margin-bottom:10px">🌱 Inicio del programa</div>`:''}
      ${selDay===endDate?`<div style="display:inline-flex;align-items:center;gap:5px;background:rgba(199,125,255,.1);color:var(--esp);font-size:11px;font-weight:700;padding:4px 10px;border-radius:8px;margin-bottom:10px">🌀 Fin del programa</div>`:''}
      ${selDaySes.map(s=>{
        const est=(s.estado||'pendiente').toLowerCase();
        const cls=est.includes('comp')?'done':est.includes('can')?'can':'pend';
        const label=est.includes('comp')?'Completada':est.includes('can')?'Cancelada':'Pendiente';
        return `<div class="dd-ses">
          <div class="dd-ses-ico">✨</div>
          <div style="flex:1"><div class="dd-ses-name">${s.sesion||s.nombre||s.tipo||'Sesión'}</div>${s.facilitador?`<div class="dd-ses-fac">${s.facilitador}</div>`:''}</div>
          <span class="ses-bdg ${cls}">${label}</span>
        </div>`;
      }).join('')}
      ${!selDaySes.length&&selDay!==startDate&&selDay!==endDate?`<div style="color:var(--muted);font-size:13px;padding:4px 0">No hay sesiones agendadas.</div>`:''}
    </div>`:''}

    <div style="display:flex;gap:14px;margin-top:10px;flex-wrap:wrap">
      ${startDate?`<div style="display:flex;align-items:center;gap:5px;font-size:10px;color:var(--muted)"><div style="width:10px;height:10px;border-radius:50%;background:rgba(74,222,128,.25)"></div>Inicio</div>`:''}
      ${endDate?`<div style="display:flex;align-items:center;gap:5px;font-size:10px;color:var(--muted)"><div style="width:10px;height:10px;border-radius:50%;background:rgba(199,125,255,.25)"></div>Fin</div>`:''}
      <div style="display:flex;align-items:center;gap:5px;font-size:10px;color:var(--muted)"><div style="width:10px;height:10px;border-radius:3px;background:rgba(61,170,106,.2)"></div>Completada</div>
      <div style="display:flex;align-items:center;gap:5px;font-size:10px;color:var(--muted)"><div style="width:10px;height:10px;border-radius:3px;background:rgba(201,168,76,.15)"></div>Pendiente</div>
    </div>
  `;
}

function calNav(dir){if(dir===0)calDate=new Date();else calDate=new Date(calDate.getFullYear(),calDate.getMonth()+dir,1);renderCalendario();}
function selectDay(date){selDay=selDay===date?null:date;renderCalendario();}

// ── SAVE ─────────────────────────────────────────────────────────────────────
let _saveTimer;
function saveProgress(cb){clearTimeout(_saveTimer);_saveTimer=setTimeout(()=>_doSave(cb),600);}
async function _doSave(cb){
  updateProgressBar();if(curTab==='semanas')renderWeekList();
  try{
    const resp=await fetch(SAVE_FN,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({recordId:curInsc.id,progreso})});
    if(!resp.ok){
      const {error}=await _sb.from('inscripciones').update({data:{...curInsc,progreso},updated_at:new Date().toISOString()}).eq('id',curInsc.id);
      if(error)console.warn('Supabase direct:',error.message);
    }
  }catch(e){console.warn('save error:',e.message);}
  if(cb)cb();
}

// ── AUTO-RESTORE ──────────────────────────────────────────────────────────────
window.addEventListener('load',()=>{
  const ser=sessionStorage.getItem('pp_ser');
  const allInsc=sessionStorage.getItem('pp_all_insc');
  const allProgs=sessionStorage.getItem('pp_all_progs');
  const code=sessionStorage.getItem('pp_code');
  const ses=sessionStorage.getItem('pp_sessions');
  if(ser&&allInsc&&allProgs&&code){
    try{
      _sb=supabase.createClient(SUPA_URL,SUPA_KEY);
      curSer=JSON.parse(ser);
      allInscList=JSON.parse(allInsc);
      allProgsList=JSON.parse(allProgs);
      allSessions=ses?JSON.parse(ses):[];
      document.getElementById('loginScreen').style.display='none';
      const matchInsc=allInscList.find(i=>String(i.code||'').trim()===code);
      if(matchInsc&&allInscList.length===1){
        const prog=allProgsList.find(p=>p.id===matchInsc.programaId);
        if(prog)launchApp(curSer,matchInsc,prog);
      }else if(allInscList.length>1){
        showSelector(curSer,allInscList,allProgsList);
      }
    }catch(e){console.warn('Restore failed',e);}
  }
});

document.addEventListener('keydown',ev=>{
  if(ev.key==='Enter'&&ev.target.id==='lCode')doLogin();
  if(ev.key==='Enter'&&ev.target.id==='lEmail')document.getElementById('lCode').focus();
});
</script>
</body>
</html>
