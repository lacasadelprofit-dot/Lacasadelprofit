<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal del Programa — La Casa del Profit</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#C9A84C">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#06060A;--sidebar:#0E0D14;--card:#141320;--card2:#1C1A2E;--border:#2A2840;
  --gold:#C9A84C;--gl:#E8C96A;--gd:#8B6914;
  --text:#EDE5C8;--muted:#7A7260;--green:#3DAA6A;--red:#E05555;
  --prog:#C9A84C;/* overridden per-program */
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}

/* ── LOGIN ── */
#loginScreen{display:flex;align-items:center;justify-content:center;min-height:100vh;
  background:radial-gradient(ellipse at 25% 25%,#1A1400 0%,#06060A 65%),
             radial-gradient(ellipse at 75% 75%,#0D0A1A 0%,transparent 50%);}
.lbox{background:var(--card);border:1px solid #3A3410;border-radius:24px;padding:48px 40px;width:420px;max-width:calc(100vw - 32px);
  box-shadow:0 0 60px rgba(201,168,76,.08),0 25px 60px rgba(0,0,0,.7);}
.llogo{text-align:center;margin-bottom:32px;}
.llogo .ico{font-size:52px;display:block;margin-bottom:12px;}
.llogo h1{font-size:20px;font-weight:800;color:var(--gl);letter-spacing:2px;}
.llogo .sub{font-size:11px;color:var(--gd);letter-spacing:1.5px;margin-top:4px;text-transform:uppercase;}
.fg{margin-bottom:16px;}
.fg label{display:block;font-size:11px;color:var(--muted);margin-bottom:7px;text-transform:uppercase;letter-spacing:.5px;font-weight:600;}
.fg input{width:100%;padding:12px 14px;background:var(--card2);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:14px;outline:none;transition:border-color .2s;}
.fg input:focus{border-color:var(--gold);}
.btn-login{width:100%;padding:14px;background:linear-gradient(135deg,var(--gold),var(--gd));border:none;border-radius:10px;color:#050401;font-size:15px;font-weight:800;cursor:pointer;letter-spacing:.5px;transition:opacity .2s;}
.btn-login:hover{opacity:.9;}
.btn-login:disabled{opacity:.5;cursor:not-allowed;}
.lerr{color:var(--red);font-size:12px;text-align:center;margin-top:10px;display:none;}

/* ── APP LAYOUT ── */
#app{display:none;}
.app-wrap{display:flex;min-height:100vh;}

/* ── SIDEBAR ── */
.sidebar{width:260px;background:var(--sidebar);border-right:1px solid #1E1C10;display:flex;flex-direction:column;position:fixed;height:100vh;overflow-y:auto;z-index:100;}
.s-head{padding:20px 18px 16px;border-bottom:1px solid #1E1C10;}
.s-prog-ico{font-size:36px;display:block;text-align:center;margin-bottom:8px;}
.s-prog-name{font-size:13px;font-weight:700;color:var(--gl);text-align:center;letter-spacing:.5px;}
.s-prog-user{font-size:11px;color:var(--muted);text-align:center;margin-top:4px;}
.s-prog-bar{height:4px;background:#1E1C10;border-radius:2px;margin-top:12px;overflow:hidden;}
.s-prog-bar-fill{height:100%;border-radius:2px;transition:width .4s ease;}
.s-prog-pct{font-size:10px;color:var(--muted);text-align:center;margin-top:5px;}

.s-nav{padding:12px 10px;flex:1;}
.week-item{display:flex;align-items:center;gap:10px;padding:10px 10px;border-radius:10px;cursor:pointer;font-size:13px;color:var(--muted);transition:all .15s;margin-bottom:2px;border:1px solid transparent;}
.week-item:hover{background:rgba(201,168,76,.06);color:var(--text);}
.week-item.active{background:rgba(201,168,76,.1);color:var(--gl);border-color:rgba(201,168,76,.2);}
.week-item .w-num{font-size:10px;font-weight:700;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#1E1C10;flex-shrink:0;}
.week-item.active .w-num{background:rgba(201,168,76,.25);color:var(--gl);}
.week-item .w-check{margin-left:auto;font-size:12px;opacity:.5;}
.week-item.done .w-check{opacity:1;color:var(--green);}

.s-foot{padding:14px;border-top:1px solid #1E1C10;}
.s-foot-user{font-size:12px;color:var(--muted);margin-bottom:8px;}
.s-foot-user strong{color:var(--text);}
.btn-logout{width:100%;padding:8px;background:var(--card2);border:1px solid var(--border);border-radius:8px;color:var(--muted);font-size:12px;cursor:pointer;transition:all .15s;}
.btn-logout:hover{border-color:var(--red);color:var(--red);}

/* ── MAIN CONTENT ── */
.main{margin-left:260px;flex:1;padding:28px 28px 60px;}

.week-header{margin-bottom:24px;}
.week-num-badge{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;margin-bottom:10px;background:rgba(201,168,76,.12);color:var(--gold);}
.week-title{font-size:26px;font-weight:800;color:var(--gl);margin-bottom:6px;}
.week-desc{font-size:14px;color:var(--muted);line-height:1.6;max-width:640px;}

/* ── SECTIONS ── */
.sec-block{background:var(--card);border:1px solid #1E1C10;border-radius:16px;padding:22px;margin-bottom:16px;}
.sec-title{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;color:var(--gl);margin-bottom:16px;}
.sec-title .ico{font-size:18px;}
.sec-title .count{font-size:11px;color:var(--muted);font-weight:500;margin-left:auto;}

/* ── DESAFÍOS ── */
.desafio-item{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-bottom:1px solid #1E1C10;}
.desafio-item:last-child{border-bottom:none;padding-bottom:0;}
.desafio-item:first-child{padding-top:0;}
.d-check{width:22px;height:22px;border:2px solid var(--border);border-radius:6px;cursor:pointer;flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;transition:all .2s;}
.d-check.done{border-color:var(--green);background:var(--green);}
.d-check.done::after{content:'✓';color:white;font-size:13px;font-weight:700;}
.d-text{font-size:14px;color:var(--text);line-height:1.5;cursor:pointer;transition:opacity .2s;}
.d-text.done{opacity:.5;text-decoration:line-through;}
.empty-msg{font-size:13px;color:var(--muted);font-style:italic;}

/* ── HÁBITOS ── */
.habito-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #1E1C10;}
.habito-row:last-child{border-bottom:none;}
.habito-name{font-size:13px;color:var(--text);flex:1;min-width:0;}
.habito-freq{font-size:10px;color:var(--muted);}
.habito-dots{display:flex;gap:6px;flex-shrink:0;}
.h-dot{width:28px;height:28px;border-radius:50%;border:2px solid var(--border);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:9px;color:var(--muted);transition:all .2s;flex-shrink:0;}
.h-dot.today{border-color:var(--gold);color:var(--gold);}
.h-dot.done{border-color:var(--green);background:var(--green);color:white;}
.h-dot.today.done{border-color:var(--green);background:var(--green);}
.habito-streak{font-size:11px;color:var(--muted);min-width:36px;text-align:right;}

/* ── MATERIALES ── */
.mat-item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #1E1C10;}
.mat-item:last-child{border-bottom:none;}
.mat-ico{width:36px;height:36px;border-radius:8px;background:#1E1C10;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
.mat-name{font-size:13px;color:var(--text);font-weight:600;}
.mat-type{font-size:11px;color:var(--muted);}
.mat-link{margin-left:auto;padding:6px 12px;border-radius:8px;background:rgba(201,168,76,.1);border:1px solid rgba(201,168,76,.2);color:var(--gold);font-size:12px;font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap;}
.mat-link:hover{background:rgba(201,168,76,.2);}

/* ── NOTAS ── */
.nota-wrap textarea{width:100%;min-height:100px;background:var(--card2);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:13px;padding:12px;outline:none;resize:vertical;font-family:inherit;line-height:1.6;transition:border-color .2s;}
.nota-wrap textarea:focus{border-color:var(--gold);}
.nota-save-row{display:flex;align-items:center;gap:10px;margin-top:10px;}
.btn-save-nota{padding:8px 20px;background:linear-gradient(135deg,var(--gold),var(--gd));border:none;border-radius:8px;color:#050401;font-size:13px;font-weight:700;cursor:pointer;transition:opacity .2s;}
.btn-save-nota:hover{opacity:.9;}
.nota-saved{font-size:11px;color:var(--green);display:none;}

/* ── SESIONES DEL PROGRAMA ── */
.ses-item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #1E1C10;}
.ses-item:last-child{border-bottom:none;}
.ses-ico{width:34px;height:34px;border-radius:8px;background:#1E1C10;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
.ses-name{font-size:13px;color:var(--text);font-weight:600;}
.ses-fac{font-size:11px;color:var(--muted);}
.ses-bdg{font-size:10px;padding:3px 8px;border-radius:12px;font-weight:700;}
.ses-bdg.pend{background:rgba(201,168,76,.1);color:var(--gold);}
.ses-bdg.done{background:rgba(61,170,106,.1);color:var(--green);}

/* ── PROGRESS TOAST ── */
#toast{position:fixed;bottom:24px;right:24px;background:var(--card);border:1px solid rgba(201,168,76,.3);border-radius:12px;padding:12px 18px;font-size:13px;color:var(--text);box-shadow:0 8px 32px rgba(0,0,0,.5);transform:translateY(80px);opacity:0;transition:all .3s;z-index:9999;}
#toast.show{transform:translateY(0);opacity:1;}

/* ── LOADER ── */
#loader{display:none;position:fixed;inset:0;background:rgba(6,6,10,.9);z-index:9999;
  align-items:center;justify-content:center;flex-direction:column;gap:16px;}
.spinner{width:44px;height:44px;border:3px solid rgba(201,168,76,.2);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
#loader p{color:var(--gl);font-size:13px;letter-spacing:1px;}

/* ── RESPONSIVE ── */
@media(max-width:700px){
  .sidebar{width:100%;height:auto;position:relative;border-right:none;border-bottom:1px solid #1E1C10;}
  .app-wrap{flex-direction:column;}
  .main{margin-left:0;padding:16px;}
  .s-nav{display:flex;overflow-x:auto;gap:6px;padding:10px;}
  .week-item{flex-shrink:0;min-width:110px;}
}
</style>
</head>
<body>

<div id="loader"><div class="spinner"></div><p>Cargando...</p></div>
<div id="toast"></div>

<!-- ══ LOGIN SCREEN ══ -->
<div id="loginScreen">
  <div class="lbox">
    <div class="llogo">
      <span class="ico">🌀</span>
      <h1>LA CASA DEL PROFIT</h1>
      <div class="sub">Portal del Programa</div>
    </div>

    <div class="fg">
      <label>Tu Email</label>
      <input type="email" id="lEmail" placeholder="tu@email.com" autocomplete="email">
    </div>
    <div class="fg">
      <label>Código de acceso</label>
      <input type="text" id="lCode" placeholder="Ingresá tu código" autocomplete="off" style="letter-spacing:2px;font-weight:700;">
    </div>

    <button class="btn-login" onclick="doLogin()" id="btnLogin">Entrar a mi programa ✨</button>
    <p class="lerr" id="lerr">Email o código incorrecto. Contactá al equipo si tenés dudas.</p>
    <p style="text-align:center;color:var(--muted);font-size:11px;margin-top:16px;line-height:1.6">Tu código de acceso fue enviado cuando te inscribiste al programa.</p>
  </div>
</div>

<!-- ══ APP ══ -->
<div id="app">
  <div class="app-wrap">

    <!-- SIDEBAR -->
    <div class="sidebar">
      <div class="s-head">
        <span class="s-prog-ico" id="sProgIco">📚</span>
        <div class="s-prog-name" id="sProgName">Programa</div>
        <div class="s-prog-user" id="sProgUser"></div>
        <div class="s-prog-bar"><div class="s-prog-bar-fill" id="sProgBarFill" style="width:0%"></div></div>
        <div class="s-prog-pct" id="sProgPct">0% completado</div>
      </div>

      <div class="s-nav" id="weekList"></div>

      <div class="s-foot">
        <div class="s-foot-user">Sesión activa: <strong id="sfUser"></strong></div>
        <button class="btn-logout" onclick="doLogout()">Cerrar sesión</button>
      </div>
    </div>

    <!-- MAIN -->
    <div class="main" id="mainContent">
      <!-- filled by renderWeek() -->
    </div>

  </div>
</div>

<script>
const SUPA_URL = 'https://vffmnyjjawvvctcqzkvj.supabase.co';
const SUPA_KEY = 'sb_publishable_A1rJIiXHSg6TQYT2gKQHUw_UTwmS76t';
const SAVE_FN  = '/api/save-progreso';

let _sb;
let curSer     = null;
let curInsc    = null;
let curProg    = null;
let curSemIdx  = 0;
let progreso   = {};   // { "semIdx": { desafios:{id:bool}, habitos:{id:[dates]}, nota:'' } }

// ── Helpers ──────────────────────────────────────────────────────────────────
function showLoader(){ document.getElementById('loader').style.display='flex'; }
function hideLoader(){ document.getElementById('loader').style.display='none'; }

let _toastTimer;
function toast(msg, dur=2800){
  const el=document.getElementById('toast');
  el.textContent=msg;
  el.classList.add('show');
  clearTimeout(_toastTimer);
  _toastTimer=setTimeout(()=>el.classList.remove('show'),dur);
}

function today(){ return new Date().toISOString().slice(0,10); }

function lastNDays(n){
  const days=[];
  for(let i=n-1;i>=0;i--){
    const d=new Date(); d.setDate(d.getDate()-i);
    days.push(d.toISOString().slice(0,10));
  }
  return days;
}

function fmtDate(d){ return d?new Date(d+'T12:00:00').toLocaleDateString('es-AR',{day:'2-digit',month:'short'}):'-'; }

function getProgreso(semIdx){ return progreso[String(semIdx)] || (progreso[String(semIdx)]={}); }

function semanaCompletada(semIdx){
  const sem = (curInsc.semanas||[])[semIdx]; if(!sem) return false;
  const p   = getProgreso(semIdx);
  const desafios = sem.desafios||[];
  if(!desafios.length) return false;
  const ds = p.desafios||{};
  return desafios.every(d => ds[d.id]);
}

function calcProgress(){
  const total=(curInsc.semanas||[]).length; if(!total) return 0;
  let done=0;
  for(let i=0;i<total;i++) if(semanaCompletada(i)) done++;
  return Math.round(done/total*100);
}

// ── Supabase helpers ─────────────────────────────────────────────────────────
function unwrap(rows){ return rows.map(r=>({id:r.id,...(r.data||{})})); }

async function sbSelect(table, filters={}){
  let q = _sb.from(table).select('id,data');
  for(const [k,v] of Object.entries(filters)) q = q.eq(`data->>${ k}`,v);
  const {data,error}=await q;
  if(error) throw error;
  return unwrap(data||[]);
}

// ── LOGIN ────────────────────────────────────────────────────────────────────
async function doLogin(){
  const email = document.getElementById('lEmail').value.trim().toLowerCase();
  const code  = document.getElementById('lCode').value.trim();
  const errEl = document.getElementById('lerr');
  errEl.style.display='none';
  if(!email||!code){ errEl.textContent='Completá email y código.'; errEl.style.display='block'; return; }

  document.getElementById('btnLogin').disabled=true;
  showLoader();
  try {
    _sb = supabase.createClient(SUPA_URL, SUPA_KEY);

    // 1. Find ser by email
    const seres = await sbSelect('seres',{email});
    if(!seres.length) throw new Error('not_found');
    const ser = seres[0];

    // 2. Find inscripcion by serId + code
    let insc = null;
    const inscList = await sbSelect('inscripciones',{serId:ser.id});
    insc = inscList.find(i => String(i.code||'').trim() === code);
    if(!insc) throw new Error('bad_code');

    // 3. Load programa
    const progs = await sbSelect('programas',{});
    const prog = progs.find(p=>p.id===insc.programaId);
    if(!prog) throw new Error('no_prog');

    // Persist session
    sessionStorage.setItem('pp_ser',  JSON.stringify(ser));
    sessionStorage.setItem('pp_insc', JSON.stringify(insc));
    sessionStorage.setItem('pp_prog', JSON.stringify(prog));

    launchApp(ser, insc, prog);

  } catch(e){
    errEl.textContent = e.message==='not_found'||e.message==='bad_code'||e.message==='no_prog'
      ? 'Email o código incorrecto. Contactá al equipo si tenés dudas.'
      : 'Error de conexión. Intentá de nuevo.';
    errEl.style.display='block';
    console.error(e);
  } finally {
    hideLoader();
    document.getElementById('btnLogin').disabled=false;
  }
}

function doLogout(){
  sessionStorage.removeItem('pp_ser');
  sessionStorage.removeItem('pp_insc');
  sessionStorage.removeItem('pp_prog');
  document.getElementById('app').style.display='none';
  document.getElementById('loginScreen').style.display='flex';
  curSer=curInsc=curProg=null;
  progreso={};
}

// ── LAUNCH APP ───────────────────────────────────────────────────────────────
function launchApp(ser, insc, prog){
  curSer  = ser;
  curInsc = insc;
  curProg = prog;
  progreso = insc.progreso || {};

  // Apply program color
  const col = prog.col||'#C9A84C';
  document.documentElement.style.setProperty('--prog',col);
  document.documentElement.style.setProperty('--gold',col);
  document.documentElement.style.setProperty('--gl', lighten(col));
  document.documentElement.style.setProperty('--gd', darken(col));

  // Sidebar header
  document.getElementById('sProgIco').textContent  = prog.ico||'📚';
  document.getElementById('sProgName').textContent = prog.nombre;
  document.getElementById('sProgUser').textContent = ser.nombre;
  document.getElementById('sfUser').textContent    = ser.nombre;

  updateProgressBar();
  renderWeekList();

  // Start at current week (0-indexed)
  curSemIdx = Math.max(0, (insc.semanaActual||1)-1);
  if(curSemIdx >= (insc.semanas||[]).length) curSemIdx=0;

  renderWeek(curSemIdx);

  document.getElementById('loginScreen').style.display='none';
  document.getElementById('app').style.display='block';
  window.scrollTo(0,0);
}

function lighten(hex){
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return `rgb(${Math.min(255,r+50)},${Math.min(255,g+50)},${Math.min(255,b+50)})`;
}
function darken(hex){
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return `rgb(${Math.max(0,r-60)},${Math.max(0,g-60)},${Math.max(0,b-60)})`;
}

// ── SIDEBAR WEEK LIST ────────────────────────────────────────────────────────
function renderWeekList(){
  const semanas = curInsc.semanas||[];
  if(!semanas.length){
    document.getElementById('weekList').innerHTML='<p style="font-size:12px;color:var(--muted);text-align:center;padding:20px">Todavía no hay semanas cargadas.</p>';
    return;
  }
  document.getElementById('weekList').innerHTML = semanas.map((s,i)=>{
    const done  = semanaCompletada(i);
    const isCur = i===curSemIdx;
    return `<div class="week-item ${isCur?'active':''} ${done?'done':''}" onclick="selectWeek(${i})">
      <div class="w-num">${s.num||i+1}</div>
      <div style="min-width:0;flex:1">
        <div style="font-size:12px;font-weight:${isCur?700:500};white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${s.titulo||'Semana '+(i+1)}</div>
      </div>
      <div class="w-check">✓</div>
    </div>`;
  }).join('');
}

function selectWeek(idx){
  saveNotaImmediate(); // save current note before switching
  curSemIdx=idx;
  renderWeekList();
  renderWeek(idx);
  window.scrollTo(0,0);
}

// ── RENDER WEEK ──────────────────────────────────────────────────────────────
function renderWeek(idx){
  const semanas = curInsc.semanas||[];
  if(!semanas.length){
    document.getElementById('mainContent').innerHTML=`
      <div style="text-align:center;padding:60px 20px;color:var(--muted)">
        <div style="font-size:40px;margin-bottom:12px">📚</div>
        <div>El contenido de tu programa todavía no está disponible.<br>El equipo lo estará cargando pronto.</div>
      </div>`;
    return;
  }
  const sem = semanas[idx];
  if(!sem){ renderWeek(0); return; }

  const col   = curProg.col||'#C9A84C';
  const p     = getProgreso(idx);
  const des   = sem.desafios||[];
  const hab   = sem.habitos||[];
  const mat   = sem.materiales||[];
  const seses = sem.sesiones||[];

  document.getElementById('mainContent').innerHTML = `
    <div class="week-header">
      <div class="week-num-badge">Semana ${sem.num||idx+1}</div>
      <div class="week-title">${sem.titulo||'Semana '+(idx+1)}</div>
      ${sem.descripcion?`<div class="week-desc">${sem.descripcion}</div>`:''}
    </div>

    ${des.length?`
    <div class="sec-block" id="blocDesafios">
      <div class="sec-title"><span class="ico">🎯</span> Desafíos de la semana <span class="count">${(Object.values(p.desafios||{}).filter(Boolean).length)}/${des.length} completados</span></div>
      <div id="desafiosList">${renderDesafios(des,p,idx,col)}</div>
    </div>`:''}

    ${hab.length?`
    <div class="sec-block" id="blocHabitos">
      <div class="sec-title"><span class="ico">🌱</span> Hábitos <span class="count">Últimos 7 días</span></div>
      <div id="habitosList">${renderHabitos(hab,p,idx)}</div>
    </div>`:''}

    ${mat.length?`
    <div class="sec-block">
      <div class="sec-title"><span class="ico">📖</span> Materiales</div>
      ${renderMateriales(mat)}
    </div>`:''}

    ${seses.length?`
    <div class="sec-block">
      <div class="sec-title"><span class="ico">✨</span> Sesiones de esta semana</div>
      ${renderSesiones(seses)}
    </div>`:''}

    <div class="sec-block">
      <div class="sec-title"><span class="ico">📝</span> Mis notas de la semana</div>
      <div class="nota-wrap">
        <textarea id="notaText" placeholder="Anotá reflexiones, aprendizajes, preguntas… este espacio es tuyo.">${p.nota||''}</textarea>
        <div class="nota-save-row">
          <button class="btn-save-nota" onclick="saveNota()">Guardar nota</button>
          <span class="nota-saved" id="notaSaved">✓ Guardado</span>
        </div>
      </div>
    </div>
  `;
}

// ── DESAFÍOS ─────────────────────────────────────────────────────────────────
function renderDesafios(des, p, semIdx, col){
  const ds = p.desafios||{};
  return des.map(d=>{
    const done = !!ds[d.id];
    return `<div class="desafio-item">
      <div class="d-check ${done?'done':''}" onclick="toggleDesafio('${d.id}',${semIdx})" id="dc_${d.id}"></div>
      <div class="d-text ${done?'done':''}" onclick="toggleDesafio('${d.id}',${semIdx})" id="dt_${d.id}">${d.texto}</div>
    </div>`;
  }).join('');
}

function toggleDesafio(dId, semIdx){
  const p  = getProgreso(semIdx);
  if(!p.desafios) p.desafios={};
  p.desafios[dId] = !p.desafios[dId];

  // Update UI
  const done = p.desafios[dId];
  const dc = document.getElementById('dc_'+dId);
  const dt = document.getElementById('dt_'+dId);
  if(dc){ dc.className='d-check'+(done?' done':''); }
  if(dt){ dt.className='d-text'+(done?' done':''); }

  // Update count
  const sem  = (curInsc.semanas||[])[semIdx];
  const des  = sem?.desafios||[];
  const cnt  = Object.values(p.desafios).filter(Boolean).length;
  const cntEl= document.querySelector('#blocDesafios .count');
  if(cntEl) cntEl.textContent=`${cnt}/${des.length} completados`;

  saveProgress();
}

// ── HÁBITOS ──────────────────────────────────────────────────────────────────
function renderHabitos(hab, p, semIdx){
  const days = lastNDays(7);
  const hs   = p.habitos||{};
  return hab.map(h=>{
    const dates = hs[h.id]||[];
    const streak = calcStreak(dates);
    const dotsHTML = days.map(d=>{
      const isToday = d===today();
      const isDone  = dates.includes(d);
      return `<div class="h-dot ${isToday?'today':''} ${isDone?'done':''}" onclick="toggleHabito('${h.id}','${d}',${semIdx})" title="${fmtDate(d)}">${isToday&&!isDone?'hoy':''}</div>`;
    }).join('');
    return `<div class="habito-row">
      <div style="flex:1;min-width:0">
        <div class="habito-name">${h.texto||h.nombre||h}</div>
        ${h.frecuencia?`<div class="habito-freq">${h.frecuencia}</div>`:''}
      </div>
      <div class="habito-dots" id="hd_${h.id}">${dotsHTML}</div>
      <div class="habito-streak" id="hs_${h.id}">${streak?'🔥'+streak:''}</div>
    </div>`;
  }).join('');
}

function toggleHabito(hId, date, semIdx){
  const p  = getProgreso(semIdx);
  if(!p.habitos) p.habitos={};
  if(!p.habitos[hId]) p.habitos[hId]=[];
  const arr = p.habitos[hId];
  const idx = arr.indexOf(date);
  if(idx>-1) arr.splice(idx,1); else arr.push(date);

  // Re-render just this habito's dots
  const days = lastNDays(7);
  const dotsEl = document.getElementById('hd_'+hId);
  if(dotsEl) dotsEl.innerHTML = days.map(d=>{
    const isToday=d===today(); const isDone=arr.includes(d);
    return `<div class="h-dot ${isToday?'today':''} ${isDone?'done':''}" onclick="toggleHabito('${hId}','${d}',${semIdx})" title="${fmtDate(d)}">${isToday&&!isDone?'hoy':''}</div>`;
  }).join('');
  const streak=calcStreak(arr);
  const strEl=document.getElementById('hs_'+hId);
  if(strEl) strEl.textContent=streak?'🔥'+streak:'';

  saveProgress();
}

function calcStreak(dates){
  if(!dates.length) return 0;
  let s=0; let d=new Date();
  while(true){
    const key=d.toISOString().slice(0,10);
    if(dates.includes(key)){s++;d.setDate(d.getDate()-1);}
    else break;
    if(s>365) break;
  }
  return s;
}

// ── MATERIALES ───────────────────────────────────────────────────────────────
function renderMateriales(mat){
  const iconForType=(t)=>{
    if(!t)return '📄';
    t=t.toLowerCase();
    if(t.includes('video')||t.includes('yt')) return '🎬';
    if(t.includes('audio')||t.includes('mp3')) return '🎧';
    if(t.includes('pdf')) return '📕';
    if(t.includes('ejercicio')||t.includes('práctica')) return '✏️';
    if(t.includes('meditaci')) return '🧘';
    return '📄';
  };
  return mat.map(m=>`
    <div class="mat-item">
      <div class="mat-ico">${iconForType(m.tipo)}</div>
      <div>
        <div class="mat-name">${m.nombre||m.titulo||'Material'}</div>
        ${m.tipo?`<div class="mat-type">${m.tipo}</div>`:''}
      </div>
      ${m.url?`<a class="mat-link" href="${m.url}" target="_blank" rel="noopener">Abrir ↗</a>`:''}
    </div>`).join('');
}

// ── SESIONES ─────────────────────────────────────────────────────────────────
function renderSesiones(seses){
  return seses.map(s=>`
    <div class="ses-item">
      <div class="ses-ico">✨</div>
      <div>
        <div class="ses-name">${s.nombre||s.tipo||'Sesión'}</div>
        ${s.facilitador?`<div class="ses-fac">${s.facilitador}</div>`:''}
      </div>
      <span class="ses-bdg ${s.estado==='Completada'?'done':'pend'}">${s.estado||'Pendiente'}</span>
    </div>`).join('');
}

// ── NOTAS ────────────────────────────────────────────────────────────────────
let _notaTimer;
function saveNota(){
  const txt = (document.getElementById('notaText')||{}).value;
  if(txt===undefined) return;
  const p = getProgreso(curSemIdx);
  p.nota = txt;
  saveProgress(()=>{
    const el = document.getElementById('notaSaved');
    if(el){ el.style.display='inline'; setTimeout(()=>el.style.display='none',2000); }
  });
}

function saveNotaImmediate(){
  const el = document.getElementById('notaText');
  if(!el) return;
  const p = getProgreso(curSemIdx);
  p.nota = el.value;
}

// ── PROGRESS SAVE ────────────────────────────────────────────────────────────
let _saveTimer;
function saveProgress(cb){
  clearTimeout(_saveTimer);
  _saveTimer=setTimeout(()=>_doSave(cb),600);
}

async function _doSave(cb){
  updateProgressBar();
  renderWeekList();
  try{
    const resp = await fetch(SAVE_FN,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({recordId:curInsc.id, progreso})
    });
    if(!resp.ok){
      // fallback: try direct Supabase update (may fail if RLS blocks it)
      const {error}=await _sb.from('inscripciones')
        .update({data:{...curInsc,progreso},updated_at:new Date().toISOString()})
        .eq('id',curInsc.id);
      if(error) console.warn('Supabase direct update error:',error.message);
    }
  }catch(e){
    console.warn('save-progreso error:',e.message);
  }
  if(cb) cb();
}

function updateProgressBar(){
  const pct=calcProgress();
  const fill=document.getElementById('sProgBarFill');
  const pctEl=document.getElementById('sProgPct');
  if(fill){ fill.style.width=pct+'%'; fill.style.background=curProg?.col||'#C9A84C'; }
  if(pctEl) pctEl.textContent=pct+'% completado';
}

// ── AUTO-RESTORE SESSION ──────────────────────────────────────────────────────
window.addEventListener('load',()=>{
  const ser  = sessionStorage.getItem('pp_ser');
  const insc = sessionStorage.getItem('pp_insc');
  const prog = sessionStorage.getItem('pp_prog');
  if(ser&&insc&&prog){
    try{
      _sb=supabase.createClient(SUPA_URL,SUPA_KEY);
      launchApp(JSON.parse(ser),JSON.parse(insc),JSON.parse(prog));
      return;
    }catch(e){ console.warn('Session restore failed',e); }
  }
});

// ── KEY SHORTCUTS ─────────────────────────────────────────────────────────────
document.addEventListener('keydown',ev=>{
  if(ev.key==='Enter'&&ev.target.id==='lCode') doLogin();
  if(ev.key==='Enter'&&ev.target.id==='lEmail') document.getElementById('lCode').focus();
});
</script>
