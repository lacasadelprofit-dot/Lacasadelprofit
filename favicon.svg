<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0E0D14"/>
      <stop offset="100%" style="stop-color:#06060A"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E8C96A"/>
      <stop offset="100%" style="stop-color:#C9A84C"/>
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect width="100" height="100" rx="18" fill="url(#bg)"/>
  <!-- Gold border ring -->
  <rect x="3" y="3" width="94" height="94" rx="16" fill="none" stroke="url(#gold)" stroke-width="2" opacity="0.8"/>
  <!-- Outer spiral arc 1 -->
  <path d="M50 15 A35 35 0 1 1 15.5 65" fill="none" stroke="#E8C96A" stroke-width="5" stroke-linecap="round" opacity="0.9"/>
  <!-- Middle spiral arc 2 -->
  <path d="M50 26 A24 24 0 1 1 27 70" fill="none" stroke="#C9A84C" stroke-width="4" stroke-linecap="round" opacity="0.75"/>
  <!-- Inner spiral arc 3 -->
  <path d="M50 37 A13 13 0 1 1 37.5 62" fill="none" stroke="#8B6914" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  <!-- Center dot -->
  <circle cx="50" cy="50" r="5" fill="url(#gold)"/>
  <circle cx="50" cy="50" r="2.2" fill="#06060A"/>
</svg>