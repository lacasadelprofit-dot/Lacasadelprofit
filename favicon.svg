<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2A1E04"/>
      <stop offset="100%" stop-color="#080A04"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E8C96A" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#E8C96A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <circle cx="50" cy="50" r="50" fill="url(#bg)"/>
  <circle cx="50" cy="50" r="50" fill="url(#glow)"/>

  <!-- Flower of Life — 7 circles, r=18 -->
  <g stroke="#C9A84C" stroke-width="1.1" fill="none" opacity="0.85">
    <circle cx="50"    cy="50"    r="18"/>
    <circle cx="50"    cy="32"    r="18"/>
    <circle cx="65.59" cy="41"    r="18"/>
    <circle cx="65.59" cy="59"    r="18"/>
    <circle cx="50"    cy="68"    r="18"/>
    <circle cx="34.41" cy="59"    r="18"/>
    <circle cx="34.41" cy="41"    r="18"/>
  </g>

  <!-- Enclosing border rings -->
  <circle cx="50" cy="50" r="36" stroke="#C9A84C" stroke-width="1.4" fill="none" opacity="0.6"/>
  <circle cx="50" cy="50" r="38.5" stroke="#C9A84C" stroke-width="0.6" fill="none" opacity="0.35"/>

  <!-- House silhouette — golden, centered -->
  <g stroke="#E8C96A" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.95">
    <polyline points="34,50 50,37 66,50"/>
    <line x1="37" y1="50" x2="37" y2="63"/>
    <line x1="63" y1="50" x2="63" y2="63"/>
    <line x1="37" y1="63" x2="63" y2="63"/>
    <path d="M46,63 L46,56 A4,4 0 0,1 54,56 L54,63"/>
  </g>

  <!-- Central glow -->
  <circle cx="50" cy="50" r="8" fill="#E8C96A" opacity="0.07"/>
</svg>
