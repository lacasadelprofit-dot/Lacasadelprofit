<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nuestro Equipo — Juan Cruz Consciencia</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta name="theme-color" content="#C17A48">
<meta property="og:title" content="Nuestro Equipo — Juan Cruz Consciencia">
<meta property="og:description" content="Conocé a los facilitadores de La Casa del Profit.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#FAFAF8;--card:#FFFFFF;--card2:#F4F2EE;--border:#E5E0D8;
  --terra:#C17A48;--terra-d:#9A5C30;--terra-l:#F0E4D6;
  --text:#1C1200;--muted:#7A6E60;
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
h1,h2,.sec-title,.eq-name{font-family:'Cormorant Garamond',Georgia,serif;}

.site-header{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;
  border-bottom:1px solid var(--border);background:rgba(250,250,248,.96);
  backdrop-filter:blur(10px);position:sticky;top:0;z-index:200;gap:16px;}
.brand{font-size:15px;font-weight:800;color:var(--text);letter-spacing:-.1px;white-space:nowrap;text-decoration:none;}
.brand span{color:var(--terra);}
.btn-agendar{font-size:13px;color:var(--terra-d);text-decoration:none;font-weight:700;
  padding:7px 16px;border:1.5px solid var(--terra);border-radius:20px;transition:all .2s;
  background:none;cursor:pointer;white-space:nowrap;}
.btn-agendar:hover{background:var(--terra);color:#fff;}

.hero{text-align:center;padding:64px 20px 40px;max-width:640px;margin:0 auto;}
.hero .pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;
  padding:5px 18px;border-radius:20px;background:var(--terra-l);
  border:1px solid rgba(193,122,72,.35);color:var(--terra-d);margin-bottom:20px;letter-spacing:.3px;}
.hero h1{font-size:34px;font-weight:800;color:var(--text);line-height:1.18;margin-bottom:14px;letter-spacing:-.5px;}
.hero p{font-size:15px;color:var(--muted);line-height:1.8;max-width:460px;margin:0 auto;}

.sec{padding:16px 16px 72px;max-width:980px;margin:0 auto;}
.eq-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:18px;}

.eq-card{background:var(--card);border:1px solid var(--border);border-radius:22px;padding:26px 22px;
  transition:box-shadow .2s,transform .15s;display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden;}
.eq-card:hover{box-shadow:0 8px 26px rgba(0,0,0,.08);transform:translateY(-2px);}
.eq-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,var(--terra-l),var(--terra),var(--terra-l));}
.eq-top{display:flex;align-items:center;gap:14px;}
.eq-avatar{width:56px;height:56px;border-radius:50%;flex-shrink:0;background-size:cover;background-position:center;
  display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:18px;
  background-color:var(--terra);}
.eq-name{font-size:19px;font-weight:700;color:var(--text);line-height:1.2;}
.eq-loc{font-size:12px;color:var(--muted);margin-top:2px;}
.eq-bio{font-size:13px;color:var(--muted);line-height:1.7;flex:1;}
.eq-chips{display:flex;flex-wrap:wrap;gap:6px;}
.eq-chip{font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;background:var(--terra-l);
  color:var(--terra-d);border:1px solid rgba(193,122,72,.2);}
.eq-badges{display:flex;gap:6px;flex-wrap:wrap;}
.eq-badge{font-size:10.5px;font-weight:600;padding:4px 10px;border-radius:20px;background:var(--card2);
  border:1px solid var(--border);color:var(--muted);}
.eq-cta{margin-top:auto;padding:10px 16px;background:var(--terra);border:none;border-radius:12px;
  color:#fff;font-size:12.5px;font-weight:800;cursor:pointer;text-decoration:none;text-align:center;
  transition:background .2s,transform .15s;}
.eq-cta:hover{background:var(--terra-d);transform:translateY(-1px);}

.eq-empty{text-align:center;padding:60px 20px;color:var(--muted);}
.eq-empty .ei{font-size:38px;margin-bottom:12px;}

footer{background:var(--text);padding:32px 24px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:16px;}
.foot-brand{font-family:'Cormorant Garamond',Georgia,serif;font-size:18px;color:#F5EFE4;letter-spacing:.04em;}
.foot-copy{font-size:11px;color:rgba(245,239,228,.3);letter-spacing:.06em;}

@media(max-width:480px){
  .hero h1{font-size:27px;}
  .eq-grid{grid-template-columns:1fr;}
}
</style>
</head>
<body>

<header class="site-header">
  <a class="brand" href="/">Juan Cruz <span>Consciencia</span></a>
  <button class="btn-agendar" onclick="location.href='/#sesiones'">Agendá una sesión ↗</button>
</header>

<div class="hero">
  <div class="pill">🙋 Nuestro Equipo</div>
  <h1>Las personas detrás de cada sesión</h1>
  <p>Facilitadores especializados en distintas herramientas de consciencia, cada uno con su propio camino y forma de acompañar.</p>
</div>

<div class="sec">
  <div class="eq-grid" id="eqGrid"></div>
</div>

<footer>
  <div class="foot-brand">Juan Cruz Consciencia</div>
  <div style="display:flex;gap:20px;align-items:center;">
    <a href="https://www.instagram.com/juancruzconsciencia/" target="_blank" aria-label="Instagram"
      style="display:flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:50%;border:1px solid rgba(245,239,228,.2);transition:border-color .2s;"
      onmouseover="this.style.borderColor='#C17A48'" onmouseout="this.style.borderColor='rgba(245,239,228,.2)'">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F5EFE4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="#F5EFE4" stroke="none"/>
      </svg>
    </a>
    <a href="https://www.tiktok.com/@juancruzconsciencia" target="_blank" aria-label="TikTok"
      style="display:flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:50%;border:1px solid rgba(245,239,228,.2);transition:border-color .2s;"
      onmouseover="this.style.borderColor='#C17A48'" onmouseout="this.style.borderColor='rgba(245,239,228,.2)'">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="#F5EFE4">
        <path d="M19.59 6.69a4.83 4.83 0 01-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 01-2.88 2.5 2.89 2.89 0 01-2.89-2.89 2.89 2.89 0 012.89-2.89c.28 0 .54.04.79.1V9.01a6.33 6.33 0 00-.79-.05 6.34 6.34 0 00-6.34 6.34 6.34 6.34 0 006.34 6.34 6.34 6.34 0 006.33-6.34V9.05a8.16 8.16 0 004.77 1.52V7.12a4.85 4.85 0 01-1-.43z"/>
      </svg>
    </a>
  </div>
  <div class="foot-copy">© 2026 Juan Cruz Consciencia</div>
</footer>

<script>
const SUPA_URL='https://vffmnyjjawvvctcqzkvj.supabase.co';
const SUPA_KEY='sb_publishable_A1rJIiXHSg6TQYT2gKQHUw_UTwmS76t';
const _sb=supabase.createClient(SUPA_URL,SUPA_KEY);
const WA_NUM='5491151758653';

function iniciales(nombre){return (nombre||'?').split(' ').map(n=>n[0]).join('').substring(0,2).toUpperCase();}

async function cargarEquipo(){
  const grid=document.getElementById('eqGrid');
  try{
    const {data,error}=await _sb.from('facilitadores').select('id,data');
    if(error)throw error;
    const facs=(data||[])
      .map(r=>({id:r.id,...r.data}))
      .filter(f=>f.activo!==false&&f.nombre)
      .sort((a,b)=>(a.nombre||'').localeCompare(b.nombre||''));
    if(!facs.length){
      grid.innerHTML='';
      grid.parentElement.innerHTML='<div class="eq-empty"><div class="ei">✦</div><p>Muy pronto vas a poder conocer a todo el equipo acá.</p></div>';
      return;
    }
    grid.innerHTML=facs.map(f=>{
      const loc=[f.ciudad,f.zona].filter(Boolean).join(', ');
      const mods=[f.pres?'Presencial':'',f.onl?'Online':''].filter(Boolean).join(' · ');
      const chips=(f.herramientas||[]).slice(0,4).map(h=>`<span class="eq-chip">${h}</span>`).join('');
      const extra=(f.herramientas||[]).length>4?`<span class="eq-chip">+${f.herramientas.length-4}</span>`:'';
      const msg=encodeURIComponent(`Hola Juan Cruz! Vi el perfil de ${f.nombre} y me gustaría agendar una sesión. ✨`);
      const avatarStyle=f.foto?`background-image:url('${f.foto}')`:'';
      return `<div class="eq-card">
        <div class="eq-top">
          <div class="eq-avatar" style="${avatarStyle}">${f.foto?'':iniciales(f.nombre)}</div>
          <div>
            <div class="eq-name">${f.nombre}</div>
            ${loc?`<div class="eq-loc">📍 ${loc}</div>`:''}
          </div>
        </div>
        ${f.bio?`<div class="eq-bio">${f.bio}</div>`:''}
        ${chips?`<div class="eq-chips">${chips}${extra}</div>`:''}
        ${mods?`<div class="eq-badges"><span class="eq-badge">${mods}</span></div>`:''}
        <a class="eq-cta" href="https://wa.me/${WA_NUM}?text=${msg}" target="_blank">Agendá con ${f.nombre.split(' ')[0]} →</a>
      </div>`;
    }).join('');
  }catch(e){
    console.error(e);
    grid.parentElement.innerHTML='<div class="eq-empty"><div class="ei">⚠️</div><p>No pudimos cargar el equipo. Intentá de nuevo más tarde.</p></div>';
  }
}
cargarEquipo();
</script>
</body>
</html>
